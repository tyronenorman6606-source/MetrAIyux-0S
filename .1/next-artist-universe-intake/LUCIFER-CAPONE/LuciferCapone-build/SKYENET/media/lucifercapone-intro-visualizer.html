<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LUCIFER CAPONE</title>
  <style>
    :root {
      --cyan: #00eaff;
      --blue: #246bff;
      --gold: #ffd36a;
      --pink: #ff3df2;
      --violet: #8b5cf6;
      --dark: #02040a;
      --px: 0;
      --py: 0;
      --flash: 0;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }

    body {
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: white;
    }

    .intro {
      position: fixed;
      inset: 0;
      overflow: hidden;
      perspective: 1500px;
      transform-style: preserve-3d;
      background:
        radial-gradient(circle at calc(50% + var(--px) * 7%) calc(18% + var(--py) * 5%), rgba(0,234,255,.16), transparent 32%),
        radial-gradient(circle at calc(50% - var(--px) * 8%) calc(78% - var(--py) * 5%), rgba(255,211,106,.12), transparent 38%),
        linear-gradient(180deg, #000 0%, #02040a 35%, #050816 64%, #000 100%);
      isolation: isolate;
      animation: cameraShake 9.8s cubic-bezier(.2,.8,.2,1) both;
    }

    .intro::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 30;
      pointer-events: none;
      background:
        linear-gradient(to bottom, rgba(255,255,255,.08), transparent 9%, transparent 91%, rgba(255,255,255,.06)),
        repeating-linear-gradient(to bottom, rgba(255,255,255,.045) 0 1px, transparent 1px 5px);
      mix-blend-mode: screen;
      opacity: .23;
    }

    .intro::after {
      content: "";
      position: absolute;
      inset: -8%;
      z-index: 31;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 35%, rgba(0,0,0,.55) 72%, #000 100%),
        rgba(255,255,255, calc(var(--flash) * .75));
      animation: introFlash 9.8s linear both;
    }

    @keyframes introFlash {
      0%, 5% { opacity: 1; }
      9%, 22% { opacity: .05; }
      24% { opacity: .88; }
      27%, 59% { opacity: .08; }
      62% { opacity: .62; }
      66%, 91% { opacity: .04; }
      100% { opacity: .18; }
    }

    @keyframes cameraShake {
      0% { transform: scale(1.04); }
      9% { transform: scale(1.01); }
      22% { transform: scale(1.012) translate3d(0,0,0); }
      24% { transform: scale(1.028) translate3d(-8px,4px,0) rotateZ(-.25deg); }
      25% { transform: scale(1.028) translate3d(7px,-5px,0) rotateZ(.25deg); }
      27% { transform: scale(1.015) translate3d(0,0,0); }
      62% { transform: scale(1.032) translate3d(5px,0,0); }
      64% { transform: scale(1.02) translate3d(-4px,2px,0); }
      100% { transform: scale(1); }
    }

    .stars,
    .nebula,
    .grid,
    .rings,
    .light-bars,
    .particles,
    .subject-stage,
    .type-stage,
    .topline,
    .replay {
      position: absolute;
      pointer-events: none;
    }

    .stars {
      inset: -20%;
      z-index: -8;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.82) 0 1px, transparent 1.6px),
        radial-gradient(circle, rgba(0,234,255,.78) 0 1px, transparent 1.8px),
        radial-gradient(circle, rgba(255,211,106,.65) 0 1px, transparent 1.7px);
      background-size: 124px 124px, 210px 210px, 310px 310px;
      background-position:
        calc(50% + var(--px) * -42px) calc(50% + var(--py) * -28px),
        calc(50% + var(--px) * -72px) calc(50% + var(--py) * -48px),
        calc(50% + var(--px) * -98px) calc(50% + var(--py) * -68px);
      opacity: 0;
      animation: starsIn 9.8s ease both;
    }

    @keyframes starsIn {
      0%, 6% { opacity: 0; filter: blur(5px); }
      15%, 100% { opacity: .48; filter: blur(.2px); }
    }

    .nebula {
      inset: -20%;
      z-index: -7;
      background:
        radial-gradient(circle at 30% 34%, rgba(139,92,246,.22), transparent 24%),
        radial-gradient(circle at 74% 48%, rgba(0,234,255,.18), transparent 26%),
        radial-gradient(circle at 48% 80%, rgba(255,211,106,.16), transparent 30%);
      filter: blur(30px);
      opacity: 0;
      transform: translate3d(calc(var(--px) * -60px), calc(var(--py) * -38px), -420px);
      animation: nebulaIn 9.8s ease both;
    }

    @keyframes nebulaIn {
      0%, 9% { opacity: 0; scale: 1.15; }
      20%, 100% { opacity: .88; scale: 1; }
    }

    .grid {
      inset: -20%;
      z-index: -6;
      opacity: 0;
      background-image:
        linear-gradient(rgba(0,234,255,.20) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,234,255,.20) 1px, transparent 1px);
      background-size: 44px 44px;
      transform: rotateX(62deg) translateY(23%) translate3d(calc(var(--px) * -28px), calc(var(--py) * -18px), -280px);
      animation: gridMove 7s linear infinite, gridReveal 9.8s ease both;
    }

    @keyframes gridMove {
      from { background-position: 0 0; }
      to { background-position: 44px 44px; }
    }

    @keyframes gridReveal {
      0%, 18% { opacity: 0; }
      27%, 100% { opacity: .22; }
    }

    .rings {
      inset: 0;
      z-index: -4;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      transform: translate3d(calc(var(--px) * -45px), calc(var(--py) * -26px), -180px);
      opacity: 0;
      animation: ringsReveal 9.8s ease both;
    }

    .rings span {
      position: absolute;
      width: min(76vw, 680px);
      aspect-ratio: 1;
      border-radius: 999px;
      border: 1px solid rgba(0,234,255,.28);
      box-shadow: 0 0 38px rgba(0,234,255,.22), inset 0 0 26px rgba(0,234,255,.12);
      transform: rotateX(73deg) rotateZ(var(--r));
      animation: ringSpin 9s linear infinite, ringPulse 3.6s ease-in-out infinite;
    }

    .rings span:nth-child(2) {
      width: min(60vw, 520px);
      border-color: rgba(255,211,106,.30);
      box-shadow: 0 0 34px rgba(255,211,106,.18), inset 0 0 22px rgba(255,211,106,.10);
      animation-delay: -1.2s;
    }

    .rings span:nth-child(3) {
      width: min(90vw, 820px);
      border-color: rgba(139,92,246,.20);
      animation-delay: -2s;
    }

    @keyframes ringsReveal {
      0%, 15% { opacity: 0; scale: .72; }
      29%, 100% { opacity: 1; scale: 1; }
    }

    @keyframes ringSpin { to { rotate: 1turn; } }
    @keyframes ringPulse {
      0%, 100% { opacity: .32; scale: .92; }
      50% { opacity: .86; scale: 1.07; }
    }

    .light-bars {
      inset: 0;
      z-index: 7;
      overflow: hidden;
      opacity: .95;
    }

    .light-bars span {
      position: absolute;
      left: -30vw;
      width: 160vw;
      height: 2px;
      border-radius: 99px;
      background: linear-gradient(90deg, transparent, rgba(0,234,255,.0), rgba(0,234,255,.92), rgba(255,211,106,.78), transparent);
      box-shadow: 0 0 24px rgba(0,234,255,.76);
      transform: translateX(-110vw) rotateZ(var(--angle));
      animation: barSweep 9.8s cubic-bezier(.19,1,.22,1) both;
      animation-delay: var(--delay);
      top: var(--top);
    }

    @keyframes barSweep {
      0%, 12% { transform: translateX(-115vw) rotateZ(var(--angle)); opacity: 0; }
      18% { opacity: 1; }
      36%, 100% { transform: translateX(115vw) rotateZ(var(--angle)); opacity: 0; }
    }

    .subject-stage {
      inset: 0;
      z-index: 3;
      display: grid;
      place-items: end center;
      transform-style: preserve-3d;
    }

    .aura {
      position: absolute;
      width: min(58vw, 510px);
      height: min(68vh, 610px);
      bottom: 8vh;
      left: 50%;
      translate: -50% 0;
      z-index: -2;
      border-radius: 45% 45% 30% 30%;
      background:
        radial-gradient(circle at 50% 14%, rgba(255,255,255,.50), transparent 15%),
        radial-gradient(circle at 50% 28%, rgba(0,234,255,.78), transparent 28%),
        radial-gradient(circle at 48% 58%, rgba(255,211,106,.50), transparent 31%),
        radial-gradient(circle at 54% 80%, rgba(139,92,246,.50), transparent 38%);
      filter: blur(38px);
      opacity: 0;
      transform: translate3d(calc(var(--px) * -62px), calc(var(--py) * -38px), -180px) scale(.82);
      animation: auraIntro 9.8s ease both;
    }

    @keyframes auraIntro {
      0%, 18% { opacity: 0; scale: .65; }
      24% { opacity: 1; scale: 1.14; }
      40%, 100% { opacity: .9; scale: 1; }
    }

    .subject,
    .subject-rim,
    .subject-ghost {
      position: absolute;
      bottom: -3vh;
      left: 50%;
      width: min(94vw, 590px);
      max-height: 92vh;
      object-fit: contain;
      object-position: center bottom;
      translate: -50% 0;
      pointer-events: none;
      user-select: none;
      will-change: transform, filter, opacity;
    }

    .subject-ghost {
      z-index: 0;
      opacity: 0;
      filter: blur(9px) brightness(0) drop-shadow(0 0 28px rgba(0,234,255,.95)) drop-shadow(0 0 60px rgba(139,92,246,.48));
      transform: translate3d(calc(var(--px) * -44px), calc(var(--py) * -20px), -135px) scale(.98);
      animation: ghostIntro 9.8s ease both;
    }

    .subject-rim {
      z-index: 2;
      opacity: 0;
      mix-blend-mode: screen;
      filter: brightness(1.5) contrast(1.25) drop-shadow(calc(var(--px) * -9px) calc(var(--py) * -6px) 10px rgba(0,234,255,.8)) drop-shadow(calc(var(--px) * 10px) calc(var(--py) * 6px) 22px rgba(255,211,106,.36));
      transform: translate3d(calc(var(--px) * 27px), calc(var(--py) * 12px), 72px) scale(1.008);
      animation: rimIntro 9.8s ease both;
    }

    .subject {
      z-index: 3;
      opacity: 0;
      transform: translate3d(calc(var(--px) * 48px), calc(var(--py) * 24px), 145px) rotateZ(calc(var(--px) * .55deg)) scale(.72);
      filter:
        drop-shadow(calc(var(--px) * -12px) calc(12px + var(--py) * 8px) 9px rgba(0,0,0,.82))
        drop-shadow(0 0 4px rgba(255,255,255,.95))
        drop-shadow(0 0 14px rgba(0,234,255,.82))
        drop-shadow(0 0 34px rgba(0,234,255,.58))
        drop-shadow(0 0 70px rgba(255,211,106,.36));
      animation: subjectIntro 9.8s cubic-bezier(.2,.9,.2,1) both, edgeGlow 2.7s ease-in-out infinite 2.4s;
    }

    @keyframes subjectIntro {
      0% { opacity: 0; transform: translate3d(calc(var(--px) * 48px), 22vh, 145px) scale(.46) rotateZ(-2deg); filter: blur(14px) brightness(.4); }
      14% { opacity: 0; }
      23% { opacity: 1; transform: translate3d(calc(var(--px) * 48px), -1.5vh, 145px) scale(1.08) rotateZ(1deg); filter: blur(0) brightness(1.25); }
      38%, 100% { opacity: 1; transform: translate3d(calc(var(--px) * 48px), calc(var(--py) * 24px), 145px) rotateZ(calc(var(--px) * .55deg)) scale(1); }
    }

    @keyframes ghostIntro {
      0%, 16% { opacity: 0; }
      25% { opacity: .52; }
      100% { opacity: .30; }
    }

    @keyframes rimIntro {
      0%, 19% { opacity: 0; }
      24% { opacity: .9; }
      42%, 100% { opacity: .48; }
    }

    @keyframes edgeGlow {
      0%, 100% {
        filter:
          drop-shadow(calc(var(--px) * -12px) calc(12px + var(--py) * 8px) 9px rgba(0,0,0,.82))
          drop-shadow(0 0 4px rgba(255,255,255,.88))
          drop-shadow(0 0 12px rgba(0,234,255,.70))
          drop-shadow(0 0 30px rgba(0,234,255,.45))
          drop-shadow(0 0 58px rgba(255,211,106,.27));
      }
      50% {
        filter:
          drop-shadow(calc(var(--px) * -14px) calc(14px + var(--py) * 8px) 11px rgba(0,0,0,.86))
          drop-shadow(0 0 6px rgba(255,255,255,1))
          drop-shadow(0 0 20px rgba(0,234,255,1))
          drop-shadow(0 0 48px rgba(0,234,255,.70))
          drop-shadow(0 0 90px rgba(255,211,106,.48));
      }
    }

    .floor {
      position: absolute;
      width: min(44vw, 360px);
      height: 48px;
      bottom: 2vh;
      left: 50%;
      translate: -50% 0;
      border-radius: 999px;
      z-index: 1;
      background: radial-gradient(ellipse at center, rgba(0,234,255,.82), rgba(38,120,255,.22) 48%, transparent 74%);
      box-shadow: 0 0 26px rgba(0,234,255,.52), 0 0 78px rgba(0,234,255,.25);
      filter: blur(.2px);
      transform: rotateX(72deg) translate3d(calc(var(--px) * -22px), calc(var(--py) * 12px), -45px);
      opacity: 0;
      animation: floorIntro 9.8s ease both;
    }

    @keyframes floorIntro {
      0%, 20% { opacity: 0; scale: .4; }
      30%, 100% { opacity: 1; scale: 1; }
    }

    .type-stage {
      inset: 0;
      z-index: 11;
      display: grid;
      place-items: center;
      transform-style: preserve-3d;
      text-align: center;
      padding: 6vw;
      mix-blend-mode: screen;
    }

    .kicker {
      position: absolute;
      top: 11vh;
      left: 50%;
      translate: -50% 0;
      font-size: clamp(10px, 1.5vw, 14px);
      letter-spacing: .5em;
      text-transform: uppercase;
      color: rgba(255,255,255,.82);
      text-shadow: 0 0 18px rgba(0,234,255,.75);
      opacity: 0;
      animation: kickerIntro 9.8s ease both;
    }

    @keyframes kickerIntro {
      0%, 28% { opacity: 0; transform: translateY(-18px); }
      38%, 86% { opacity: 1; transform: translateY(0); }
      100% { opacity: .55; }
    }

    .name {
      position: relative;
      margin: 0;
      font-size: clamp(4.1rem, 15vw, 13.5rem);
      line-height: .8;
      letter-spacing: -.07em;
      text-transform: uppercase;
      font-weight: 1000;
      color: transparent;
      -webkit-text-stroke: clamp(1px, .25vw, 3px) rgba(255,255,255,.9);
      text-shadow:
        0 0 18px rgba(0,234,255,.88),
        0 0 52px rgba(0,234,255,.48),
        0 0 90px rgba(255,211,106,.23);
      transform: translate3d(calc(var(--px) * 32px), calc(var(--py) * 18px), 230px) scale(.88);
      opacity: 0;
      animation: titleIntro 9.8s cubic-bezier(.2,.9,.2,1) both;
    }

    .name::before,
    .name::after {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .name::before {
      color: rgba(0,234,255,.85);
      clip-path: inset(0 0 52% 0);
      transform: translate(calc(var(--px) * -8px), -3px);
      animation: glitchA 1.9s steps(2,end) infinite 2.4s;
    }

    .name::after {
      color: rgba(255,61,242,.65);
      clip-path: inset(48% 0 0 0);
      transform: translate(calc(var(--px) * 8px), 3px);
      animation: glitchB 2.4s steps(2,end) infinite 2.1s;
    }

    @keyframes titleIntro {
      0%, 31% { opacity: 0; transform: translate3d(calc(var(--px) * 32px), 10vh, 230px) scale(1.22); filter: blur(18px); }
      37% { opacity: 1; transform: translate3d(calc(var(--px) * 32px), -1vh, 230px) scale(.94); filter: blur(0); }
      48%, 100% { opacity: 1; transform: translate3d(calc(var(--px) * 32px), calc(var(--py) * 18px), 230px) scale(1); }
    }

    @keyframes glitchA {
      0%, 90%, 100% { translate: 0 0; opacity: .35; }
      92% { translate: 14px -2px; opacity: .9; }
      94% { translate: -10px 1px; opacity: .65; }
    }

    @keyframes glitchB {
      0%, 88%, 100% { translate: 0 0; opacity: .22; }
      90% { translate: -12px 2px; opacity: .75; }
      92% { translate: 8px -1px; opacity: .55; }
    }

    .tagline {
      position: absolute;
      bottom: 11vh;
      left: 50%;
      translate: -50% 0;
      width: min(92vw, 980px);
      display: flex;
      justify-content: center;
      gap: clamp(.6rem, 2vw, 1.4rem);
      flex-wrap: wrap;
      text-transform: uppercase;
      letter-spacing: .28em;
      font-size: clamp(10px, 1.7vw, 15px);
      color: rgba(255,255,255,.86);
      text-shadow: 0 0 16px rgba(255,211,106,.5);
      opacity: 0;
      animation: taglineIntro 9.8s ease both;
    }

    .tagline span {
      padding: .58rem .78rem;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      box-shadow: inset 0 0 18px rgba(255,255,255,.04), 0 0 18px rgba(0,234,255,.14);
      backdrop-filter: blur(10px);
    }

    @keyframes taglineIntro {
      0%, 45% { opacity: 0; transform: translateY(20px); }
      55%, 88% { opacity: 1; transform: translateY(0); }
      100% { opacity: .72; }
    }

    .topline {
      top: 22px;
      left: 24px;
      right: 24px;
      z-index: 20;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      color: rgba(255,255,255,.72);
      text-transform: uppercase;
      letter-spacing: .22em;
      font-size: 10px;
      opacity: 0;
      animation: uiIntro 9.8s ease both;
    }

    .meter {
      width: min(34vw, 260px);
      height: 2px;
      border-radius: 99px;
      background: rgba(255,255,255,.12);
      overflow: hidden;
    }

    .meter::before {
      content: "";
      display: block;
      height: 100%;
      width: 100%;
      transform-origin: left;
      transform: scaleX(0);
      background: linear-gradient(90deg, var(--cyan), var(--gold));
      box-shadow: 0 0 16px rgba(0,234,255,.7);
      animation: meterRun 9.8s linear both;
    }

    @keyframes meterRun { to { transform: scaleX(1); } }
    @keyframes uiIntro {
      0%, 7% { opacity: 0; }
      12%, 100% { opacity: 1; }
    }

    .particles {
      inset: 0;
      z-index: 8;
      overflow: hidden;
    }

    .particle {
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--s);
      height: var(--s);
      border-radius: 999px;
      background: white;
      box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
      opacity: 0;
      transform: translate3d(calc(var(--px) * var(--dx)), calc(var(--py) * var(--dy)), var(--z));
      animation: particleFloat var(--dur) linear infinite;
      animation-delay: var(--delay);
    }

    @keyframes particleFloat {
      0% { margin-top: 42px; opacity: 0; scale: .5; }
      16%, 72% { opacity: .88; }
      100% { margin-top: -130px; opacity: 0; scale: 1.3; }
    }

    .replay {
      right: 22px;
      bottom: 22px;
      z-index: 50;
      pointer-events: auto;
      border: 1px solid rgba(255,255,255,.20);
      color: rgba(255,255,255,.86);
      background: rgba(0,0,0,.34);
      border-radius: 999px;
      padding: 10px 14px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 10px;
      cursor: pointer;
      box-shadow: 0 0 22px rgba(0,234,255,.20), inset 0 0 16px rgba(255,255,255,.05);
      backdrop-filter: blur(12px);
      opacity: 0;
      animation: replayIn 9.8s ease both;
    }

    @keyframes replayIn {
      0%, 80% { opacity: 0; transform: translateY(12px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 620px) {
      .subject,
      .subject-rim,
      .subject-ghost { width: 116vw; bottom: 0; }
      .name { font-size: clamp(4.2rem, 18vw, 8rem); }
      .kicker { top: 9vh; letter-spacing: .32em; }
      .tagline { bottom: 9vh; letter-spacing: .18em; }
      .topline { left: 14px; right: 14px; }
      .meter { width: 42vw; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        animation-duration: .001ms !important;
        animation-iteration-count: 1 !important;
        scroll-behavior: auto !important;
      }
    }

    body.chrome-less .topline,
    body.chrome-less .replay {
      display: none;
    }

    body.loop-mode .intro {
      min-height: 100vh;
    }
  </style>
</head>
<body>
  <main class="intro" id="intro" aria-label="LUCIFER CAPONE">
    <div class="stars"></div>
    <div class="nebula"></div>
    <div class="grid"></div>

    <div class="rings" aria-hidden="true">
      <span style="--r: 12deg"></span>
      <span style="--r: -18deg"></span>
      <span style="--r: 34deg"></span>
    </div>

    <div class="light-bars" aria-hidden="true">
      <span style="--top: 18%; --angle: -7deg; --delay: .6s"></span>
      <span style="--top: 42%; --angle: 4deg; --delay: 1.2s"></span>
      <span style="--top: 71%; --angle: -3deg; --delay: 2.1s"></span>
      <span style="--top: 54%; --angle: 8deg; --delay: 5.4s"></span>
    </div>

    <section class="subject-stage" aria-hidden="true">
      <div class="aura"></div>
      <div class="floor"></div>
      <img class="subject-ghost lucifer-capone-img" alt="" />
      <img class="subject-rim lucifer-capone-img" alt="" />
      <img class="subject lucifer-capone-img" alt="LUCIFER CAPONE" />
    </section>

    <section class="type-stage">
      <div class="kicker">LUCIFER CAPONE</div>
      <h1 class="name" data-text="LUCIFER CAPONE">LUCIFER CAPONE</h1>
      <div class="tagline" aria-hidden="true"></div>
    </section>

    <div class="particles" aria-hidden="true" id="particles"></div>

    <div class="topline" aria-hidden="true">
      <span>LUCIFER CAPONE</span>
      <div class="meter"></div>

    document.querySelectorAll('.lucifer-capone-img').forEach((img) => {
      img.src = LUCIFER CAPONE_IMAGE;
    });

    const root = document.documentElement;
    const target = { x: 0, y: 0 };
    const current = { x: 0, y: 0 };
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

    function setTarget(x, y) {
      target.x = Math.max(-1, Math.min(1, (x / innerWidth - .5) * 2));
      target.y = Math.max(-1, Math.min(1, (y / innerHeight - .5) * 2));
    }

    function raf() {
      current.x += (target.x - current.x) * .08;
      current.y += (target.y - current.y) * .08;
      root.style.setProperty('--px', current.x.toFixed(4));
      root.style.setProperty('--py', current.y.toFixed(4));
      requestAnimationFrame(raf);
    }

    if (!reduced) {
      addEventListener('pointermove', (e) => setTarget(e.clientX, e.clientY), { passive: true });
      addEventListener('pointerleave', () => { target.x = 0; target.y = 0; });
      addEventListener('deviceorientation', (e) => {
        if (e.gamma == null || e.beta == null) return;
        target.x = Math.max(-1, Math.min(1, e.gamma / 28));
        target.y = Math.max(-1, Math.min(1, (e.beta - 45) / 32));
      }, { passive: true });
      raf();
    }

    const particles = document.getElementById('particles');
    const particleCount = 42;
    for (let i = 0; i < particleCount; i++) {
      const p = document.createElement('i');
      p.className = 'particle';
      p.style.setProperty('--x', `${8 + Math.random() * 84}%`);
      p.style.setProperty('--y', `${12 + Math.random() * 76}%`);
      p.style.setProperty('--s', `${2 + Math.random() * 4}px`);
      p.style.setProperty('--dx', `${30 + Math.random() * 110}px`);
      p.style.setProperty('--dy', `${20 + Math.random() * 80}px`);
      p.style.setProperty('--z', `${90 + Math.random() * 220}px`);
      p.style.setProperty('--dur', `${3.5 + Math.random() * 4.5}s`);
      p.style.setProperty('--delay', `${-Math.random() * 8}s`);
      particles.appendChild(p);
    }

    function restartIntro() {
      const intro = document.getElementById('intro');
      intro.style.animation = 'none';
      intro.offsetHeight;
      intro.style.animation = '';

      document.querySelectorAll('*').forEach((el) => {
        const value = getComputedStyle(el).animationName;
        if (value && value !== 'none') {
          el.style.animation = 'none';
          el.offsetHeight;
          el.style.animation = '';
        }
      });
    }

    document.getElementById('replay').addEventListener('click', restartIntro);

    if (loopMode && !reduced) {
      setInterval(restartIntro, 9800);
    }
  </script>
