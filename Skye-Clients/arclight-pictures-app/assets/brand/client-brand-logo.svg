<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" role="img" aria-labelledby="title desc">
  <title id="title">ArcLight Pictures Logo</title>
  <desc id="desc">Neutral white-label logo for a local business app template.</desc>
  <defs>
    <linearGradient id="markGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7f9"/>
      <stop offset=".46" stop-color="#22c55e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="900" height="260" rx="38" fill="#07111f"/>
  <g transform="translate(54 45)">
    <rect width="170" height="170" rx="32" fill="#0d1b2f" stroke="rgba(255,255,255,.2)" stroke-width="2"/>
    <path d="M43 116 84 43l42 73H96l-12-23-12 23H43Z" fill="url(#markGradient)" filter="url(#softGlow)"/>
    <path d="M38 134h94" stroke="#e5f3ff" stroke-width="11" stroke-linecap="round"/>
    <circle cx="138" cy="37" r="11" fill="#f8fafc"/>
  </g>
  <g fill="#f8fafc" font-family="Inter, Arial, sans-serif">
    <text x="260" y="116" font-size="58" font-weight="800" letter-spacing="0">ARCLIGHT PICTURES</text>
    <text x="263" y="164" font-size="24" font-weight="600" fill="#b8c7d9" letter-spacing="3">LOCAL BUSINESS APP</text>
  </g>
</svg>
