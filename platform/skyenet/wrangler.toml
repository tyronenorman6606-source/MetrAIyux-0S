name = "skyenet"
main = "worker.js"
compatibility_date = "2026-05-15"
keep_vars = true
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[vars]
ZERO_OS_ORIGIN = "https://metraiyux-0s-full-system.graylondonskyes.workers.dev"
SKYENET_RUNTIME_ORIGIN = "https://skyegatefs27-citadeldb.graylondonskyes.workers.dev"
SKYENET_PUBLIC_HOST = "skyenet.graylondonskyes.workers.dev"

[[services]]
binding = "SKYENET_RUNTIME"
service = "skyegatefs27-citadeldb"

[[services]]
binding = "ZERO_OS_WORKER"
service = "metraiyux-0s-full-system"

[observability]
enabled = true
