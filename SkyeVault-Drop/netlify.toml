[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["internal-pages/**", "SkyeVault-Drop/internal-pages/**"]

[[redirects]]
  from = "/admin.html"
  to = "/.netlify/functions/operator-page?page=admin"
  status = 200
  force = true

[[redirects]]
  from = "/setup.html"
  to = "/.netlify/functions/operator-page?page=setup"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
