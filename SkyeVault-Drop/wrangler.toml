name = "skyevault-drop"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-05-16"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = [
  "/api/*",
  "/.netlify/functions/*",
  "/admin.html",
  "/setup.html"
]

[observability]
enabled = true

[triggers]
crons = ["0 3 * * *"]
