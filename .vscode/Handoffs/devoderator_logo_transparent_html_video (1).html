<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>DevodeRator Transparent Logo Video</title>
<style>
  :root {
    --gold: #ffcf3a;
    --hot: #fff4a8;
    --cyan: #00eaff;
    --violet: #b037ff;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    display: grid;
    place-items: center;
  }

  .video {
    position: relative;
    width: 100vw;
    height: 100vh;
    min-height: 620px;
    overflow: hidden;
    background: transparent;
    isolation: isolate;
  }

  .logo-deck {
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    transform-style: preserve-3d;
  }

  .logo-shell {
    position: relative;
    width: min(82vw, 720px);
    aspect-ratio: 400 / 600;
    display: grid;
    place-items: center;
    animation:
      deckEnter 11s cubic-bezier(.16,1,.3,1) infinite,
      breathe 3.4s ease-in-out infinite;
  }

  .logo-img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: auto;
    filter:
      drop-shadow(0 0 22px rgba(0,234,255,.72))
      drop-shadow(0 0 34px rgba(176,55,255,.46))
      drop-shadow(0 -10px 46px rgba(255,207,58,.78));
    animation: logoCurrent 2.8s ease-in-out infinite, glitchNudge 7.3s steps(1) infinite;
    z-index: 10;
  }

  .logo-ghost {
    position: absolute;
    width: 100%;
    height: 100%;
    object-fit: contain;
    opacity: .22;
    filter: blur(14px) saturate(1.6);
    transform: scale(1.08);
    animation: ghostPulse 3s ease-in-out infinite;
    z-index: 2;
  }

  .gold-driver {
    position: absolute;
    top: 4%;
    left: 50%;
    width: 54%;
    height: 28%;
    transform: translateX(-50%);
    z-index: 18;
    opacity: .95;
    pointer-events: none;
    mix-blend-mode: screen;
  }

  .gold-driver svg {
    width: 100%;
    height: 100%;
    overflow: visible;
  }

  .stroke-hot {
    fill: none;
    stroke: var(--hot);
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 8px var(--gold)) drop-shadow(0 0 22px var(--gold));
    stroke-dasharray: 12 18;
    animation: energyRace .64s linear infinite, flicker 1.4s steps(7) infinite;
  }

  .stroke-gold {
    fill: none;
    stroke: var(--gold);
    stroke-width: 7;
    stroke-linecap: round;
    stroke-linejoin: round;
    opacity: .76;
    filter: blur(.6px) drop-shadow(0 0 24px var(--gold));
    stroke-dasharray: 34 18;
    animation: energyRace 1s linear infinite reverse, flicker 2s steps(9) infinite;
  }

  .apex-beam {
    position: absolute;
    top: -8%;
    left: 50%;
    width: 10px;
    height: 36%;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, white 18%, var(--hot) 38%, rgba(255,207,58,.64), transparent);
    filter: blur(.4px) drop-shadow(0 0 12px white) drop-shadow(0 0 32px var(--gold));
    opacity: 0;
    z-index: 17;
    animation: beamStrike 11s ease-in-out infinite;
  }

  .apex-core {
    position: absolute;
    top: 11.5%;
    left: 50%;
    width: 46px;
    aspect-ratio: 1;
    transform: translateX(-50%);
    border-radius: 999px;
    background: radial-gradient(circle, white 0 8%, var(--hot) 18%, var(--gold) 42%, transparent 72%);
    box-shadow: 0 0 30px white, 0 0 80px var(--gold), 0 0 160px rgba(255, 168, 0, .65);
    z-index: 19;
    animation: corePulse 1.2s ease-in-out infinite, coreTimeline 11s ease-in-out infinite;
  }

  .eye-flare {
    position: absolute;
    left: 50%;
    top: 42%;
    width: 36%;
    height: 7%;
    transform: translate(-50%, -50%);
    background: linear-gradient(90deg, transparent, rgba(0,234,255,.08), white, rgba(0,234,255,.18), transparent);
    filter: blur(4px) drop-shadow(0 0 22px var(--cyan));
    mix-blend-mode: screen;
    opacity: 0;
    z-index: 20;
    animation: eyeSweep 11s ease-in-out infinite;
  }

  .sparks {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 22;
    overflow: hidden;
  }

  .spark {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--s);
    height: var(--s);
    border-radius: 999px;
    opacity: 0;
    transform: translateY(0) scale(.4);
    animation: sparkFloat var(--dur) linear infinite;
    animation-delay: var(--delay);
  }

  .spark.gold {
    background: var(--gold);
    box-shadow: 0 0 12px var(--gold), 0 0 32px rgba(255,207,58,.8);
  }

  .spark.cyan {
    background: var(--cyan);
    box-shadow: 0 0 12px var(--cyan), 0 0 30px rgba(0,234,255,.58);
  }

  .spark.violet {
    background: var(--violet);
    box-shadow: 0 0 12px var(--violet), 0 0 30px rgba(176,55,255,.58);
  }

  .spark.white {
    background: white;
    box-shadow: 0 0 12px white, 0 0 34px rgba(255,255,255,.72);
  }

  @keyframes deckEnter {
    0% {
      opacity: 0;
      transform: scale(.72) translateY(54px) rotateX(18deg);
      filter: blur(18px);
    }
    9% {
      opacity: 1;
      transform: scale(1.04) translateY(0) rotateX(0);
      filter: blur(0);
    }
    16% {
      transform: scale(1);
    }
    72% {
      opacity: 1;
      transform: scale(1.03) translateY(-8px);
      filter: blur(0);
    }
    87% {
      opacity: 1;
      transform: scale(1.10) translateY(-16px);
      filter: blur(0);
    }
    100% {
      opacity: 0;
      transform: scale(1.22) translateY(-34px);
      filter: blur(18px);
    }
  }

  @keyframes breathe {
    0%, 100% { translate: 0 0; }
    50% { translate: 0 -10px; }
  }

  @keyframes logoCurrent {
    0%, 100% {
      filter:
        drop-shadow(0 0 22px rgba(0,234,255,.72))
        drop-shadow(0 0 34px rgba(176,55,255,.46))
        drop-shadow(0 -10px 46px rgba(255,207,58,.78));
    }
    50% {
      filter:
        drop-shadow(0 0 36px rgba(0,234,255,.95))
        drop-shadow(0 0 56px rgba(176,55,255,.7))
        drop-shadow(0 -18px 72px rgba(255,207,58,1));
    }
  }

  @keyframes glitchNudge {
    0%, 92%, 100% { transform: translate(0,0); }
    93% { transform: translate(2px,-1px); }
    94% { transform: translate(-3px,1px); }
    95% { transform: translate(1px,0); }
  }

  @keyframes ghostPulse {
    0%, 100% { opacity: .14; transform: scale(1.06); }
    50% { opacity: .34; transform: scale(1.13); }
  }

  @keyframes beamStrike {
    0%, 3% { opacity: 0; transform: translateX(-50%) scaleY(.1); }
    7% { opacity: 1; transform: translateX(-50%) scaleY(1); }
    14%, 76% { opacity: .62; transform: translateX(-50%) scaleY(.82); }
    83% { opacity: 1; transform: translateX(-50%) scaleY(1.12); }
    100% { opacity: 0; transform: translateX(-50%) scaleY(.1); }
  }

  @keyframes corePulse {
    0%, 100% { transform: translateX(-50%) scale(.78); }
    50% { transform: translateX(-50%) scale(1.18); }
  }

  @keyframes coreTimeline {
    0%, 100% { opacity: 0; }
    8%, 82% { opacity: 1; }
  }

  @keyframes eyeSweep {
    0%, 21% { opacity: 0; transform: translate(-90%, -50%) scaleX(.2); }
    27% { opacity: .95; transform: translate(-50%, -50%) scaleX(1.2); }
    34% { opacity: 0; transform: translate(0%, -50%) scaleX(.2); }
    100% { opacity: 0; }
  }

  @keyframes energyRace {
    to { stroke-dashoffset: -140; }
  }

  @keyframes flicker {
    0%, 100% { opacity: .92; }
    20% { opacity: .48; }
    34% { opacity: 1; }
    50% { opacity: .64; }
    70% { opacity: 1; }
  }

  @keyframes sparkFloat {
    0% {
      opacity: 0;
      transform: translate3d(0, 18px, 0) scale(.35);
    }
    18% {
      opacity: .9;
    }
    70% {
      opacity: .62;
    }
    100% {
      opacity: 0;
      transform: translate3d(34px, -76px, 0) scale(1);
    }
  }

  @media (max-width: 720px) {
    .video {
      min-height: 100vh;
    }

    .logo-shell {
      width: min(96vw, 520px);
    }
  }
</style>
