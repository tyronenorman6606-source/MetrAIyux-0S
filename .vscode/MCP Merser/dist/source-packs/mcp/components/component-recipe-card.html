<!doctype html>

<body style="margin:0;background:#04050b;padding:24px">
<style>
  .mxm-block{--mxm-void:#04050b;--mxm-panel:rgba(8,13,31,.84);--mxm-line:rgba(149,205,255,.22);--mxm-gold:#f7c95b;--mxm-blue:#20b7ff;--mxm-cyan:#42fff1;--mxm-ink:#f7fbff;--mxm-muted:#a8b6ce;box-sizing:border-box;position:relative;isolation:isolate;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--mxm-ink);background:radial-gradient(circle at 15% 12%,rgba(32,183,255,.22),transparent 32%),radial-gradient(circle at 90% 0%,rgba(247,201,91,.16),transparent 34%),linear-gradient(135deg,#04050b,#080b18);border:1px solid var(--mxm-line);border-radius:28px;padding:28px;box-shadow:0 28px 90px rgba(0,0,0,.38);overflow:hidden;max-width:980px;margin:24px auto}
  .mxm-block *{box-sizing:border-box}.mxm-block:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at 50% 20%,black,transparent 76%);z-index:-1}.mxm-icon{width:56px;height:56px;filter:drop-shadow(0 0 18px rgba(32,183,255,.48))}.mxm-kicker{display:inline-flex;gap:8px;align-items:center;color:#80dcff;text-transform:uppercase;letter-spacing:.16em;font-size:.72rem;font-weight:900}.mxm-kicker:before{content:"";width:8px;height:8px;border-radius:50%;background:#66ffb8;box-shadow:0 0 18px #66ffb8}.mxm-title{font-size:clamp(2rem,4vw,4.4rem);line-height:.95;letter-spacing:-.05em;text-transform:uppercase;margin:14px 0}.mxm-copy{color:#c5d4e8;line-height:1.65;font-size:1rem;margin:0}.mxm-row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.mxm-pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:999px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:white;text-decoration:none;font-weight:800}.mxm-pill.primary{background:linear-gradient(135deg,var(--mxm-gold),var(--mxm-blue));color:#02040a;border-color:rgba(255,255,255,.3)}.mxm-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:22px}.mxm-card{border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.055);padding:18px}.mxm-card b{display:block;color:#ffeb9a;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;margin-bottom:8px}.mxm-card span{color:#dbe9ff;line-height:1.5}.mxm-code{font-family:"SFMono-Regular",Consolas,monospace;border:1px solid rgba(32,183,255,.22);border-radius:18px;background:rgba(0,0,0,.34);padding:15px;color:#bdefff;line-height:1.55;overflow:auto}.mxm-actions{margin-top:24px}.mxm-stack{display:grid;gap:12px;margin-top:20px}.mxm-step{display:grid;grid-template-columns:48px 1fr;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.1);border-radius:20px;background:rgba(255,255,255,.045);padding:13px}.mxm-step i{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-style:normal;font-weight:950;background:linear-gradient(135deg,var(--mxm-gold),var(--mxm-blue));color:#02040a}.mxm-step strong{display:block}.mxm-step span{display:block;color:var(--mxm-muted);line-height:1.45;margin-top:3px}@media(max-width:720px){.mxm-grid{grid-template-columns:1fr}.mxm-block{padding:22px;border-radius:22px}.mxm-title{font-size:2.35rem}}

  </div>
