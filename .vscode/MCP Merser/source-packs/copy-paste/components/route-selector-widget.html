<style>
.mx-widget{--void:#04050b;--panel:rgba(8,13,31,.82);--ink:#f7fbff;--muted:#a8b6ce;--gold:#f7c95b;--blue:#20b7ff;--cyan:#42fff1;--success:#66ffb8;--line:rgba(149,205,255,.18);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);box-sizing:border-box}.mx-widget *{box-sizing:border-box}.mx-surface{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:radial-gradient(circle at 12% 8%,rgba(32,183,255,.22),transparent 34%),radial-gradient(circle at 92% 0%,rgba(247,201,91,.18),transparent 30%),linear-gradient(135deg,#03040a,#080b18 52%,#02030a);box-shadow:0 30px 90px rgba(0,0,0,.44);isolation:isolate}.mx-surface:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.05) 1px,transparent 1px);background-size:44px 44px;mask-image:radial-gradient(circle at center,black,transparent 78%);z-index:-1}.mx-eyebrow{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(32,183,255,.24);background:rgba(32,183,255,.08);color:#80dcff;border-radius:999px;padding:9px 12px;text-transform:uppercase;letter-spacing:.18em;font-size:.72rem;font-weight:900}.mx-eyebrow:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 18px var(--success)}.mx-title{font-size:clamp(2.4rem,6vw,5.6rem);line-height:.9;letter-spacing:-.05em;text-transform:uppercase;margin:18px 0 14px}.mx-title span{display:block}.mx-stroke{color:transparent;-webkit-text-stroke:1.1px rgba(255,255,255,.76);text-shadow:0 0 38px rgba(32,183,255,.25)}.mx-fill{background:linear-gradient(100deg,#fff,#dff4ff 40%,#ffeb9a 70%,#80dcff);-webkit-background-clip:text;background-clip:text;color:transparent}.mx-copy{color:#c3d2e5;font-size:1.05rem;line-height:1.66;margin:0}.mx-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}.mx-pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:44px;padding:0 18px;border:1px solid rgba(255,255,255,.12);border-radius:999px;color:#fff;background:rgba(255,255,255,.06);text-decoration:none;font-weight:900}.mx-pill-primary{background:linear-gradient(135deg,var(--gold),var(--blue));color:#02040a;border-color:rgba(255,255,255,.32)}.mx-icon-wrap{width:82px;height:82px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(255,255,255,.06);box-shadow:0 0 40px rgba(32,183,255,.15)}.mx-inline-svg{width:100%;height:100%;display:block}.mx-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.mx-card{border:1px solid rgba(255,255,255,.1);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.mx-card h3{font-size:1.28rem;margin:16px 0 8px}.mx-card p{color:#a8b6ce;line-height:1.55;margin:0}.mx-terminal{border:1px solid rgba(32,183,255,.18);background:rgba(1,4,12,.72);border-radius:20px;padding:16px;color:#bdefff;line-height:1.55;font-family:Consolas,monospace;font-size:.9rem}.mx-terminal b{color:#ffeb9a}.mx-input-row{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}.mx-input-row input{min-width:0;border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.07);color:white;outline:none;padding:13px}.mx-input-row button{border:0;border-radius:16px;padding:0 18px;color:#02040a;background:linear-gradient(135deg,var(--gold),var(--blue));font-weight:950;cursor:pointer}.mx-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.mx-metric{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);border-radius:22px;padding:18px}.mx-metric b{display:block;font-size:2.15rem;color:#fff}.mx-metric span{display:block;color:#a8b6ce;text-transform:uppercase;letter-spacing:.12em;font-size:.72rem;margin-top:4px}.mx-route-tabs{display:grid;gap:10px}.mx-route-tabs button{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.045);border-radius:20px;color:#fff;padding:14px;cursor:pointer}.mx-route-tabs i{height:44px;border-radius:15px;display:grid;place-items:center;font-style:normal;font-weight:950;color:#02040a;background:linear-gradient(135deg,var(--gold),var(--blue))}.mx-route-panel{margin-top:14px;border:1px solid rgba(255,255,255,.1);border-radius:22px;background:rgba(255,255,255,.05);padding:18px;color:#c3d2e5}.mx-dock{display:flex;flex-wrap:wrap;gap:10px}.mx-dock a{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(255,255,255,.06);padding:11px 13px;color:#fff;text-decoration:none;font-weight:850}.mx-dock .mx-icon-wrap{width:34px;height:34px;border-radius:12px}.mx-price{font-size:3.25rem;line-height:1;font-weight:950;margin:18px 0;color:#fff}.mx-list{display:grid;gap:10px;margin:20px 0}.mx-list span{display:flex;gap:10px;color:#c3d2e5}.mx-list span:before{content:"✓";color:var(--success);font-weight:950}@media(max-width:760px){.mx-grid,.mx-metrics{grid-template-columns:1fr}.mx-title{font-size:3rem}.mx-input-row{grid-template-columns:1fr}.mx-widget{max-width:100%}}
</style>
<div class="mx-widget mx-surface" style="padding:28px;max-width:720px;">
  <span class="mx-eyebrow">Command routing</span>
  <h2 class="mx-title" style="font-size:clamp(2rem,4vw,4.3rem);"><span class="mx-stroke">Choose</span><span class="mx-fill">the pressure</span></h2>
  <div class="mx-route-tabs" role="tablist" aria-label="Operating routes">
    <button type="button" data-mx-route="client"><i>01</i><span><strong>Client delivery</strong><br>Workspaces, onboarding, status, escalation.</span></button>
    <button type="button" data-mx-route="revenue"><i>02</i><span><strong>Revenue motion</strong><br>Buyer rooms, proposals, capability packets.</span></button>
    <button type="button" data-mx-route="proof"><i>03</i><span><strong>Proof review</strong><br>Receipts, ledgers, maps, claim boundaries.</span></button>
  </div>
  <div class="mx-route-panel" id="mxRoutePanel"><strong>Client delivery:</strong> Route customers into onboarding, document requests, status boards, and renewal review.</div>
</div>
<script>
(() => {
  const copy = {
    client:'<strong>Client delivery:</strong> Route customers into onboarding, document requests, status boards, and renewal review.',
    revenue:'<strong>Revenue motion:</strong> Move serious buyers through proposals, proof packets, and closing rooms.',
    proof:'<strong>Proof review:</strong> Keep public claims attached to receipts, ledgers, and human approvals.'
  };
  document.querySelectorAll('[data-mx-route]').forEach((button, index) => {
    if(index === 0) button.setAttribute('aria-selected','true');
    button.addEventListener('click', () => {
      document.querySelectorAll('[data-mx-route]').forEach(b => b.setAttribute('aria-selected','false'));
      button.setAttribute('aria-selected','true');
      document.getElementById('mxRoutePanel').innerHTML = copy[button.dataset.mxRoute];
    });
  });
})();
</script>
