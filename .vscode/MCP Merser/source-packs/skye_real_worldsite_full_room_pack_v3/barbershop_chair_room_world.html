(()=>{const CONTENT={chair:{tag:"01 / Chair",title:"Book The Chair",text:"The barber chair is the main conversion object. The visitor walks up to the chair, chooses the service, sees the next available time, and books from inside the shop.",bullets:["Service selector belongs here: cut, fade, taper, beard, VIP chair.","Deposit and appointment confirmation connect from this zone.","This is the primary CTA, but it lives inside the physical scene."],actions:[["Book Now","#booking"],["Call Shop","tel:6232607073"]]},menu:{tag:"02 / Price Menu",title:"Services On The Wall",text:"The visitor looks right and sees the actual service board. Price, duration, prep notes, and style examples open without breaking the room.",bullets:["Each row can become a real service card.","Prices can connect directly to booking.","Service explanations stay contextual."],actions:[["Choose Service","#services"]]},gallery:{tag:"03 / Gallery Wall",title:"Business Gallery On The Wall",text:"The gallery is not a random grid. It is a physical wall in the barbershop. A real client version replaces these frames with actual cuts, fades, designs, and customer-approved photos.",bullets:["Before/after photos hang on the wall.","Frames can filter by style: fade, taper, beard, kids, designs.","Clicking a style can preselect the related booking service."],actions:[["View Gallery","#gallery"]]},counter:{tag:"04 / Booking Counter",title:"Walk To The Counter",text:"The counter holds booking confirmation, payments, deposit policy, customer info, and follow-up routing. This is the intake desk inside the website.",bullets:["Calendar integration can live here.","Deposit/payment can live here.","SMS/email confirmation can live here."],actions:[["Start Booking","#booking"],["Request Callback","#callback"]]},products:{tag:"05 / Product Shelf",title:"Aftercare Shelf",text:"The visitor looks left and sees products on the shelf: pomade, beard oil, brushes, merch, and aftercare bundles tied to the service they booked.",bullets:["Retail products belong inside the shop environment.","Aftercare can be offered after service selection.","Stripe checkout or Square checkout can connect here."],actions:[["Shop Products","#products"]]},mirror:{tag:"06 / Proof Mirror",title:"Proof In The Mirror",text:"The mirror is the trust layer: reviews, transformations, sanitation standards, regular client quotes, and proof of skill.",bullets:["Customer reviews can appear as reflected notes.","Before/after proof can animate across the mirror.","Licenses, sanitation, and shop standards can live here."],actions:[["Read Reviews","#reviews"]]},location:{tag:"07 / Door",title:"Location Door",text:"The door is where the digital experience turns into a real visit: hours, address, map, parking, policies, and phone.",bullets:["Map and directions are attached to the door.","Hours and late policy live here.","Call, text, or route to Google Business profile."],actions:[["Get Directions","#location"],["Call","tel:6232607073"]]}};
const body=document.body,canvas=document.getElementById("field"),ctx=canvas.getContext("2d",{alpha:true}),stage=document.getElementById("stage"),camera=document.getElementById("camera"),hudBar=document.getElementById("hudBar"),drawer=document.getElementById("drawer"),drawerTag=document.getElementById("drawerTag"),drawerTitle=document.getElementById("drawerTitle"),drawerText=document.getElementById("drawerText"),drawerBullets=document.getElementById("drawerBullets"),drawerActions=document.getElementById("drawerActions");let w=0,h=0,dpr=1,parts=[],unlocked=false,pointer=false,dragging=false,lastX=0,lastY=0;const state={x:0,y:0,z:.82,r:0,tx:0,ty:0,tz:.82,tr:0,manualX:0,manualY:0,manualZ:1,manualR:0};function clamp(n,min,max){return Math.max(min,Math.min(max,n))}function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;canvas.style.width=w+"px";canvas.style.height=h+"px";ctx.setTransform(dpr,0,0,dpr,0,0);parts=Array.from({length:Math.max(60,Math.min(130,Math.floor(w*h/17000)))},(_,i)=>({x:Math.random()*w,y:Math.random()*h,vx:(Math.random()-.5)*.18,vy:(Math.random()-.5)*.18,r:Math.random()*1.6+.4,a:Math.random()*.36+.08,g:i%4===0}))}function draw(){ctx.clearRect(0,0,w,h);const grd=ctx.createRadialGradient(w*.5,h*.46,0,w*.5,h*.46,Math.max(w,h)*.62);grd.addColorStop(0,"rgba(228,182,80,.055)");grd.addColorStop(.42,"rgba(27,92,255,.035)");grd.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=grd;ctx.fillRect(0,0,w,h);for(const p of parts){p.x+=p.vx;p.y+=p.vy;if(p.x<0)p.x=w;if(p.x>w)p.x=0;if(p.y<0)p.y=h;if(p.y>h)p.y=0;ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=p.g?"rgba(228,182,80,"+p.a+")":"rgba(105,244,255,"+p.a+")";ctx.fill()}}function progress(){return clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight),0,1)}function updateTargets(){const p=progress();hudBar.style.width=(p*100).toFixed(2)+"%";if(!unlocked)return;const path=[[0,0,.82,0],[420,160,1.02,-2.5],[-520,120,1.05,2.5],[610,-130,1.1,-5],[520,300,1.12,-4],[-620,260,1.08,5],[0,420,.98,0],[760,80,1.04,-5]],pos=p*(path.length-1),i=Math.floor(pos),t=pos-i,a=path[i],b=path[Math.min(i+1,path.length-1)],lerp=(x,y)=>x+(y-x)*t;state.tx=lerp(a[0],b[0])+state.manualX;state.ty=lerp(a[1],b[1])+state.manualY;state.tz=clamp(lerp(a[2],b[2])*state.manualZ,.45,2.2);state.tr=lerp(a[3],b[3])+state.manualR}function render(){state.x+=(state.tx-state.x)*.085;state.y+=(state.ty-state.y)*.085;state.z+=(state.tz-state.z)*.075;state.r+=(state.tr-state.r)*.08;camera.style.transform=`translate3d(calc(-50% + ${state.x.toFixed(2)}px),calc(-50% + ${state.y.toFixed(2)}px),0) scale(${state.z.toFixed(4)}) rotateZ(${state.r.toFixed(3)}deg)`}function loop(){draw();updateTargets();render();requestAnimationFrame(loop)}function unlock(jump=false){if(unlocked)return;unlocked=true;body.classList.remove("lock");if(jump)document.getElementById("m1").scrollIntoView({behavior:"smooth"});if(window.gsap&&window.ScrollTrigger){gsap.registerPlugin(ScrollTrigger);gsap.to(".chair",{y:-14,scale:1.04,scrollTrigger:{trigger:".scrollTrack",start:"top top",end:"bottom bottom",scrub:1}});gsap.to(".mirror",{boxShadow:"inset 0 0 80px rgba(255,255,255,.08),0 32px 100px rgba(0,0,0,.5),0 0 82px rgba(105,244,255,.2)",scrollTrigger:{trigger:".scrollTrack",start:"top top",end:"bottom bottom",scrub:1}});gsap.to(".galleryWall",{x:-22,y:-10,scrollTrigger:{trigger:".scrollTrack",start:"top top",end:"bottom bottom",scrub:1}});gsap.to(".menuBoard",{x:-24,y:10,scrollTrigger:{trigger:".scrollTrack",start:"top top",end:"bottom bottom",scrub:1}})}}function openZone(id){const c=CONTENT[id];if(!c)return;drawerTag.textContent=c.tag;drawerTitle.textContent=c.title;drawerText.textContent=c.text;drawerBullets.innerHTML="";drawerActions.innerHTML="";c.bullets.forEach(b=>{const li=document.createElement("li");li.textContent=b;drawerBullets.appendChild(li)});c.actions.forEach((a,i)=>{const link=document.createElement("a");link.textContent=a[0];link.href=a[1];if(i===0)link.className="primary";drawerActions.appendChild(link)});drawer.classList.add("open")}function focusZone(id){unlock(false);const map={chair:[0,120,1.14,0],menu:[-520,60,1.18,4],gallery:[-650,-220,1.12,5],products:[650,-110,1.16,-5],counter:[0,-390,1.14,0],mirror:[0,360,1.08,0],location:[-820,-80,1.06,5]},m=map[id]||[0,0,1,0];state.manualX=m[0];state.manualY=m[1];state.manualZ=m[2];state.manualR=m[3];openZone(id)}stage.addEventListener("pointerdown",e=>{if(!unlocked)return;pointer=true;dragging=true;lastX=e.clientX;lastY=e.clientY;stage.classList.add("dragging");stage.setPointerCapture(e.pointerId)});stage.addEventListener("pointermove",e=>{if(!pointer||!dragging)return;const dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;state.manualX+=dx;state.manualY+=dy});function end(){pointer=false;dragging=false;stage.classList.remove("dragging")}stage.addEventListener("pointerup",end);stage.addEventListener("pointercancel",end);stage.addEventListener("lostpointercapture",end);stage.addEventListener("wheel",e=>{if(!unlocked)return;if(e.ctrlKey||Math.abs(e.deltaX)>Math.abs(e.deltaY)){e.preventDefault();state.manualZ=clamp(state.manualZ-e.deltaY*.0015,.5,2.2);state.manualX-=e.deltaX*1.1}}, {passive:false});document.body.addEventListener("click",e=>{const hs=e.target.closest(".hotspot");if(hs)focusZone(hs.dataset.id);const btn=e.target.closest("[data-focus]");if(btn)focusZone(btn.dataset.focus)});document.getElementById("enter").onclick=e=>{e.preventDefault();unlock(true)};document.getElementById("skip").onclick=()=>unlock(true);document.getElementById("replay").onclick=()=>location.reload();document.getElementById("close").onclick=()=>drawer.classList.remove("open");document.getElementById("zoomIn").onclick=()=>state.manualZ=clamp(state.manualZ+.12,.5,2.2);document.getElementById("zoomOut").onclick=()=>state.manualZ=clamp(state.manualZ-.12,.5,2.2);document.getElementById("reset").onclick=()=>{state.manualX=0;state.manualY=0;state.manualZ=1;state.manualR=0;drawer.classList.remove("open")};document.getElementById("search").oninput=e=>{const q=e.target.value.trim().toLowerCase();if(!q)return;const found=Object.keys(CONTENT).find(k=>(CONTENT[k].title+" "+CONTENT[k].text+" "+CONTENT[k].bullets.join(" ")).toLowerCase().includes(q));if(found)focusZone(found)};addEventListener("resize",resize,{passive:true});addEventListener("scroll",updateTargets,{passive:true});addEventListener("keydown",e=>{if(!unlocked)return;if(e.key==="Escape")drawer.classList.remove("open");if(e.key==="0"){state.manualX=0;state.manualY=0;state.manualZ=1;state.manualR=0}if(e.key==="+"||e.key==="=")state.manualZ=clamp(state.manualZ+.12,.5,2.2);if(e.key==="-")state.manualZ=clamp(state.manualZ-.12,.5,2.2)});resize();loop();setTimeout(()=>unlock(false),8600)})();
