<style>
.mx2{--void:#04050b;--panel:rgba(8,13,31,.86);--ink:#f7fbff;--muted:#a8b6ce;--gold:#f7c95b;--blue:#20b7ff;--cyan:#42fff1;--purple:#9d7cff;--success:#66ffb8;--danger:#ff5d7e;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);box-sizing:border-box}.mx2 *{box-sizing:border-box}.mx2-shell{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:radial-gradient(circle at 12% 8%,rgba(32,183,255,.20),transparent 34%),radial-gradient(circle at 92% 0%,rgba(247,201,91,.16),transparent 30%),linear-gradient(135deg,#03040a,#080b18 52%,#02030a);box-shadow:0 30px 90px rgba(0,0,0,.40);isolation:isolate}.mx2-shell:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,black,transparent 80%);z-index:-1}.mx2-kicker{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(32,183,255,.24);background:rgba(32,183,255,.08);color:#80dcff;border-radius:999px;padding:8px 11px;text-transform:uppercase;letter-spacing:.16em;font-size:.70rem;font-weight:900}.mx2-kicker:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 18px var(--success)}.mx2-title{font-size:clamp(2rem,5vw,4.8rem);line-height:.92;letter-spacing:-.05em;text-transform:uppercase;margin:16px 0 12px}.mx2-title span{display:block}.mx2-stroke{color:transparent;-webkit-text-stroke:1.05px rgba(255,255,255,.74);text-shadow:0 0 36px rgba(32,183,255,.22)}.mx2-fill{background:linear-gradient(100deg,#fff,#dff4ff 40%,#ffeb9a 70%,#80dcff);-webkit-background-clip:text;background-clip:text;color:transparent}.mx2-copy{color:#c3d2e5;font-size:1.02rem;line-height:1.64;margin:0}.mx2-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mx2-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.mx2-two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.mx2-card{border:1px solid rgba(255,255,255,.10);border-radius:24px;background:linear-gradient(180deg,rgba(255,255,255,.075),rgba(255,255,255,.035));padding:22px;box-shadow:0 24px 80px rgba(0,0,0,.25)}.mx2-card h3{font-size:1.18rem;margin:12px 0 8px}.mx2-card p{color:#a8b6ce;line-height:1.55;margin:0}.mx2-pill{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:42px;padding:0 16px;border:1px solid rgba(255,255,255,.12);border-radius:999px;color:#fff;background:rgba(255,255,255,.06);text-decoration:none;font-weight:900;cursor:pointer}.mx2-pill-primary{background:linear-gradient(135deg,var(--gold),var(--blue));color:#02040a;border-color:rgba(255,255,255,.32)}.mx2-icon{width:72px;height:72px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);border-radius:22px;background:rgba(255,255,255,.06);box-shadow:0 0 40px rgba(32,183,255,.14);flex:0 0 auto}.mx2-icon svg,.mx2-inline-svg{width:100%;height:100%;display:block}.mx2-terminal{border:1px solid rgba(32,183,255,.18);background:rgba(1,4,12,.72);border-radius:18px;padding:14px;color:#bdefff;line-height:1.55;font-family:Consolas,monospace;font-size:.88rem}.mx2-terminal b{color:#ffeb9a}.mx2-input{border:1px solid rgba(255,255,255,.12);border-radius:16px;background:rgba(255,255,255,.07);color:white;outline:none;padding:12px 13px;min-width:0}.mx2-list{display:grid;gap:10px;margin:16px 0}.mx2-list span{display:flex;gap:10px;color:#c3d2e5}.mx2-list span:before{content:"✓";color:var(--success);font-weight:950}.mx2-table{width:100%;border-collapse:separate;border-spacing:0 10px}.mx2-table th{color:#80dcff;text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.13em}.mx2-table td{background:rgba(255,255,255,.05);border-top:1px solid rgba(255,255,255,.09);border-bottom:1px solid rgba(255,255,255,.09);padding:14px;color:#dbe9ff}.mx2-table td:first-child{border-left:1px solid r <section class="mx2 mx2-shell" style="padding:18px;display:grid;grid-template-columns:220px 1fr;gap:16px;min-height:360px;"><aside class="mx2-card"><span class="mx2-badge">operator</span><div class="mx2-list"><span>Command</span><span>Clients</span><span>Proof</span><span>Revenue</span></div></aside><main class="mx2-card"><span class="mx2-kicker">Today</span><h2 class="mx2-title" style="font-size:2.7rem;"><span class="mx2-stroke">Control</span><span class="mx2-fill">center</span></h2><p class="mx2-copy">Use this shell for private dashboards and internal operator rooms.</p></main></section>
