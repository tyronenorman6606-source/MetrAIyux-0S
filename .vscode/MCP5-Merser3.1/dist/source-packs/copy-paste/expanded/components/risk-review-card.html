<style>
.mx2{--void:#04050b;--panel:rgba(8,13,31,.86);--ink:#f7fbff;--muted:#a8b6ce;--gold:#f7c95b;--blue:#20b7ff;--cyan:#42fff1;--purple:#9d7cff;--success:#66ffb8;--danger:#ff5d7e;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);box-sizing:border-box}.mx2 *{box-sizing:border-box}.mx2-shell{position:relative;overflow:hidden;border:1px solid rgba(255,255,255,.12);border-radius:28px;background:radial-gradient(circle at 12% 8%,rgba(32,183,255,.20),transparent 34%),radial-gradient(circle at 92% 0%,rgba(247,201,91,.16),transparent 30%),linear-gradient(135deg,#03040a,#080b18 52%,#02030a);box-shadow:0 30px 90px rgba(0,0,0,.40);isolation:isolate}.mx2-shell:before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,black,transparent 80%);z-index:-1}.mx2-kicker{display:inline-flex;align-items:center;gap:9px;border:1px solid rgba(32,183,255,.24);background:rgba(32,183,255,.08);color:#80dcff;border-radius:999px;padding:8px 11px;text-transform:uppercase;letter-spacing:.16em;font-size:.70rem;font-weight:900}.mx2-kicker:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--success);box-shadow:0 0 18px var(--success)}.mx2-title{font-size:clamp(2rem,5vw,4.8rem);line-height:.92;letter-spacing:-.05em;text-transform:uppercase;margin:16px 0 12px}.mx2-title span{display:block}.mx2-stroke{color:transparent;-webkit-text-stroke:1.05px rgba(255,255,255,.74);text-shadow:0 0 36px rgba(32,183,255,.22)}.mx2-fill{background:linear-gradient(100deg,#fff,#dff4ff 40%,#ffeb9a 70%,#80dcff);-webkit-background-clip:text;background-clip:text;color:transparent}.mx2-copy{color:#c3d2e5;font-size:1.02rem;line-height:1.64;margin:0}.mx2-row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.mx2-grid{display:grid;grid-template-columns:r gba(255,255,255,.09);border-radius:16px 0 0 16px}.mx2-table td:last-child{border-right:1px solid rgba(255,255,255,.09);border-radius:0 16px 16px 0}.mx2-badge{display:inline-flex;align-items:center;border:1px solid rgba(102,255,184,.24);background:rgba(102,255,184,.08);color:#b7ffdd;border-radius:999px;padding:7px 10px;text-transform:uppercase;letter-spacing:.13em;font-size:.66rem;font-weight:900}.mx2-progress{height:10px;border-radius:999px;background:rgba(255,255,255,.09);overflow:hidden}.mx2-progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--gold),var(--blue))}@media(max-width:760px){.mx2-grid,.mx2-two{grid-template-columns:1fr}.mx2-title{font-size:2.8rem}.mx2-table{display:block;overflow:auto}.mx2-shell{border-radius:22px}}
