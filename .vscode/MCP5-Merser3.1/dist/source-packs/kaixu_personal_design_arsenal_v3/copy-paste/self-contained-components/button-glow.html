<style>
:root{
  --kx-bg:#05030b; --kx-panel:rgba(14,10,28,.78); --kx-panel2:rgba(33,17,58,.72); --kx-line:rgba(255,255,255,.16);
  --kx-text:#fff8e8; --kx-muted:#c9bddb; --kx-hot:#ff36d2; --kx-cyan:#32f5ff; --kx-gold:#ffd66b; --kx-violet:#8d57ff; --kx-green:#65ffbd;
  --kx-radius:28px; --kx-radius-sm:18px; --kx-shadow:0 28px 90px rgba(0,0,0,.48), inset 0 1px 0 rgba(255,255,255,.12);
  --kx-font:Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
}
*{box-sizing:border-box} html{scroll-behavior:smooth} body{margin:0;font-family:var(--kx-font);background:radial-gradient(circle at 10% 10%,rgba(255,54,210,.25),transparent 30%),radial-gradient(circle at 85% 20%,rgba(50,245,255,.18),transparent 30%),radial-gradient(circle at 50% 100%,rgba(255,214,107,.13),transparent 35%),var(--kx-bg);color:var(--kx-text);min-height:100vh;}
body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:42px 42px;mask-image:radial-gradient(circle at center,#000 0,transparent 76%);opacity:.65;}
a{color:inherit;text-decoration:none}.kx-shell{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0}.kx-nav{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:14px 16px;border:1px solid var(--kx-line);background:rgba(5,3,11,.62);border-radius:999px;backdrop-filter:blur(18px);position:sticky;top:14px;z-index:10;box-shadow:var(--kx-shadow)}
.kx-brand{display:flex;gap:12px;align-items:center;font-weight:900;letter-spacing:.04em}.kx-brand-mark{width:42px;height:42px;border-radius:16px;background:conic-gradient(from 210deg,var(--kx-hot),var(--kx-cyan),var(--kx-gold),var(--kx-hot));box-shadow:0 0 34px rgba(255,54,210,.45);display:grid;place-items:center}.kx-brand-mark svg{width:28px;height:28px}.kx-nav-links{display:flex;gap:10px;flex-wrap:wrap}.kx-nav a,.kx-chip{border:1px solid rgba(255,255,255,.14);padding:9px 13px;border-radius:999px;background:rgba(255,255,255,.06);color:var(--kx-muted);font-size:13px}.kx-hero{display:grid;grid-template-columns:1.15fr .85fr;gap:24px;align-items:center;padding:72px 0 38px}.kx-eyebrow{display:inline-flex;gap:9px;align-items:center;color:var(--kx-gold);font-weight:900;text-transform:uppercase;font-size:12px;letter-spacing:.16em}.kx-title{font-size:clamp(44px,8vw,96px);line-height:.88;margin:18px 0;background:linear-gradient(115deg,#fff,var(--kx-gold),var(--kx-cyan),var(--kx-hot));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.075em}.kx-copy{font-size:clamp(17px,2vw,22px);line-height:1.55;color:var(--kx-muted);max-width:720px}.kx-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}.kx-btn{border:0;border-radius:18px;padding:14px 18px;font-weight:900;cursor:pointer;color:#0b0714;background:linear-gradient(135deg,var(--kx-gold),#fff0a8 50%,var(--kx-cyan));box-shadow:0 16px 42px rgba(255,214,107,.2);display:inline-flex;gap:10px;align-items:center}.kx-btn.dark{color:var(--kx-text);background:linear-gradient(135deg,rgba(255,54,210,.24),rgba(50,245,255,.16));border:1px solid rgba(255,255,255,.18)}.kx-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.kx-card{border:1px solid var(--kx-line);background:linear-gradient(145deg,var(--kx-panel),var(--kx-panel2));border-radius:var(--kx-radius);box-shadow:var(--kx-shadow);padding:22px;position:relative;overflow:hidden}.kx-card:before{content:"";position:absolute;inset:-2px;background:radial-gradient(circle at var(--mx,20%) var(--my,20%),rgba(50,245,255,.16),transparent 34%);pointer-events:none}.kx-card>*{position:relative}.kx-card h3{font-size:24px;margin:12px 0 8px}.kx-card p{color:var(--kx-muted);line-height:1.55}.kx-icon{width:70px;height:70px;display:inline-grid;place-items:center;filter:drop-shadow(0 16px 30px rgba(50,245,255,.22))}.kx-icon svg{width:100%;height:100%}.kx-metric{font-size:34px;font-weight:950;color:var(--kx-gold)}.kx-console{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;background:#07030f;border:1px solid rgba(101,255,189,.22);border-radius:24px;padding:20px;color:#b8ffd9;box-shadow:inset 0 0 40px rgba(101,255,189,.07)}.kx-console div{padding:7px 0;border-bottom:1px dashed rgba(101,255,189,.12)}.kx-console div:last-child{border-bottom:0}.kx-form{display:grid;gap:12px}.kx-input,.kx-textarea{width:100%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);color:var(--kx-text);border-radius:16px;padding:14px;font:inherit}.kx-textarea{min-height:120px}.kx-pricing{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.kx-price{font-size:46px;font-weight:950;color:var(--kx-cyan)}.kx-phone{max-width:340px;margin:auto;border:1px solid rgba(255,255,255,.18);border-radius:42px;padding:14px;background:linear-gradient(145deg,#12091f,#08030f);box-shadow:0 30px 90px rgba(0,0,0,.55)}.kx-phone-screen{min-height:600px;border-radius:32px;background:radial-gradient(circle at top,rgba(255,54,210,.22),transparent 34%),#090411;padding:22px;border:1px solid rgba(255,255,255,.1)}.kx-row{display:flex;align-items:center;justify-content:space-between;gap:12px}.kx-stack{display:grid;gap:16px}.kx-pill{display:inline-flex;align-items:center;gap:8px;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:8px 12px;background:rgba(255,255,255,.06);color:var(--kx-muted);font-size:13px}.kx-pill svg{width:22px;height:22px}.kx-orb{aspect-ratio:1;border-radius:42px;background:radial-gradient(circle at 32% 28%,#fff 0 5%,var(--kx-gold) 6% 18%,var(--kx-hot) 19% 44%,var(--kx-violet) 45% 64%,#07030f 65%);box-shadow:inset -32px -32px 60px rgba(0,0,0,.35),0 0 70px rgba(255,54,210,.38);transform:perspective(900px) rotateX(12deg) rotateY(-18deg)}.kx-footer{padding:42px 0;color:var(--kx-muted);border-top:1px solid rgba(255,255,255,.12);margin-top:42px}@media(max-width:860px){.kx-hero,.kx-grid,.kx-pricing{grid-template-columns:1fr}.kx-nav{border-radius:24px;align-items:flex-start}.kx-nav,.kx-nav-links{flex-direction:column}.kx-title{font-size:52px}}
.kx-self-wrap{padding:28px;background:#05030b;color:var(--kx-text);font-family:var(--kx-font)}
</style>
<div class="kx-self-wrap">
<button class="kx-btn">Launch System</button>
<button class="kx-btn dark">Open Command Deck</button>
</div>
<script>
document.querySelectorAll('.kx-card').forEach(card=>card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%')}));
</script>
