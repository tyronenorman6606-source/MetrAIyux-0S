name = "skyegatefs27-citadeldb"
main = "cloudflare/worker.mjs"
compatibility_date = "2026-05-30"
compatibility_flags = ["nodejs_compat"]
keep_vars = true
workers_dev = true

[vars]
RELAY13_0S_API_BASE_URL = "https://metraiyux-0s-full-system.graylondonskyes.workers.dev/api/relay13"
CONTACT_INTAKE_0S_ORIGIN = "https://metraiyux-0s-full-system.graylondonskyes.workers.dev"
CONTACT_INTAKE_RELAY13_WORKSPACE = "connectlog-main"
FS27_RUNTIME_DIRECT_ARCHIVE = "sync"
SKYPAY_ORDER_LEDGER_DRIVER = "d1"
SKYGATE_SKIP_SCHEMA_BOOTSTRAP = "true"
SKYGATE_DB_QUERY_TIMEOUT_MS = "8000"
SKYPAY_STRIPE_LOOKUP_TIMEOUT_MS = "8000"
SKYPAY_PROVIDER_FETCH_TIMEOUT_MS = "20000"
ZERO_OS_PROVIDER_FETCH_TIMEOUT_MS = "20000"

[triggers]
crons = ["* * * * *"]

[[services]]
binding = "RELAY13_WORKER"
service = "relay13-core"

[[services]]
binding = "METRAIYUX_0S_WORKER"
service = "metraiyux-0s-full-system"

[[analytics_engine_datasets]]
binding = "REQUEST_ANALYTICS"
dataset = "fs27_runtime_requests"

[[queues.producers]]
binding = "REQUEST_EVENT_QUEUE"
queue = "fs27-runtime-events"

[[queues.consumers]]
queue = "fs27-runtime-events"
max_batch_size = 100
max_batch_timeout = 5
max_retries = 5
dead_letter_queue = "fs27-runtime-events-dlq"

[[r2_buckets]]
binding = "REQUEST_LOG_BUCKET"
bucket_name = "fs27-runtime-request-logs"

[[r2_buckets]]
binding = "DEPLOYMENT_ASSET_BUCKET"
bucket_name = "zero-os-deploy-artifacts"

[[r2_buckets]]
binding = "SKYENET_SOURCE_TRANSFER_BUCKET"
bucket_name = "zero-os-deploy-artifacts"

[[worker_loaders]]
binding = "SKYENET_FUNCTION_LOADER"

[[kv_namespaces]]
binding = "ROUTING_KV"
id = "62d5bbc0c9e946b489dc44507fb8c40b"

[[d1_databases]]
binding = "RUNTIME_ROLLUP_DB"
database_name = "metraiyux-citadeldb"
database_id = "5b572a90-75e0-4126-8d91-0bf370a8ba9d"

[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true

[observability]
enabled = true
