<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Deployment Atlas - MetrAIyux Empire</title>
<meta name="description" content="Live-only deployment atlas for MetrAIyux and Skyes Over London production surfaces.">
<meta name="robots" content="noindex,nofollow">
<meta http-equiv="refresh" content="0; url=https://metraiyux-ecosystem-portal.pages.dev/operator/deployment-ledger">
<link rel="canonical" href="https://metraiyux-ecosystem-portal.pages.dev/operator/deployment-ledger">
<style>
:root {
  --bg: #020509;
  --ink: #fff8e8;
  --cyan: #54f0ff;
  --gold: #ffd66b;
  --muted: #8eb0bf;
  --font: "DM Sans", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
body {
  min-height: 100vh;
  margin: 0;
  display: grid;
  place-items: center;
  padding: 24px;
  background:
    radial-gradient(900px 620px at 20% 10%, rgba(255, 214, 107, .14), transparent 62%),
    radial-gradient(780px 560px at 80% 20%, rgba(84, 240, 255, .12), transparent 58%),
    var(--bg);
  color: var(--ink);
  font-family: var(--font);
}
main {
  width: min(680px, 100%);
  border: 1px solid rgba(255, 255, 255, .14);
  border-radius: 8px;
  padding: clamp(28px, 7vw, 56px);
  background: rgba(4, 11, 17, .82);
  box-shadow: 0 30px 90px rgba(0, 0, 0, .42);
}
img {
  width: 54px;
  height: 54px;
  object-fit: contain;
  filter: drop-shadow(0 0 18px rgba(255, 214, 107, .32));
}
h1 {
  margin: 20px 0 12px;
  font-size: clamp(2.6rem, 8vw, 5rem);
  line-height: .98;
  letter-spacing: 0;
}
p {
  margin: 0 0 22px;
  color: var(--muted);
  font-size: 1rem;
  line-height: 1.65;
}
a {
  display: inline-flex;
  min-height: 44px;
  align-items: center;
  border: 1px solid rgba(255, 214, 107, .46);
  border-radius: 8px;
  padding: 0 15px;
  color: var(--ink);
  background: linear-gradient(135deg, rgba(255, 214, 107, .22), rgba(84, 240, 255, .12));
  font-weight: 900;
  text-decoration: none;
}
a:focus-visible,
a:hover {
  border-color: rgba(84, 240, 255, .62);
}
</style>
</head>
<body>
<main>
  <img src="/assets/metraiyux-0s-emblem-transparent.png" alt="">
  <h1>Live Deployment Atlas</h1>
  <p>The public deployment map now lives on the MetrAIyux Ecosystem Portal and shows live or access-gated surfaces only.</p>
  <a href="https://metraiyux-ecosystem-portal.pages.dev/operator/deployment-ledger">Open atlas</a>
</main>
</body>
</html>
