<script>
(async()=>{

function normalizeState(input){
  const base=blankState();
  const s=(input&&typeof input==='object')?input:{};

  out.schemaVersion=3; out.settings={...base.settings,...(s.settings||{})};
  out.people=Array.isArray(s.people)?s.people.map(p=>({id:p.id||uid(),name:String(p.name||'Unnamed Person').slice(0,120),role:String(p.role||'').slice(0,100),email:String(p.email||'').slice(0,140),phone:String(p.phone||'').slice(0,80),notes:String(p.notes||'').slice(0,2000),active:p.active!==false})):base.people;
  if(!out.people.length) out.people=base.people;
  const personIds=new Set(out.people.map(p=>p.id));
  const fallbackPerson=out.people[0].id;
  out.rules=Array.isArray(s.rules)?s.rules.map(r=>({id:r.id||uid(),name:String(r.name||'Unnamed Rule').slice(0,140),notes:String(r.notes||'').slice(0,2000),active:r.active!==false,lines:Array.isArray(r.lines)?r.lines.map(l=>({id:l.id||uid(),personId:personIds.has(l.personId)?l.personId:fallbackPerson,type:['percent','fixed','remainder'].includes(l.type)?l.type:'percent',value:round2(l.type==='remainder'?0:num(l.value))})):[]})):base.rules;
  out.rules=out.rules.filter(r=>r.lines.length); if(!out.rules.length) out.rules=base.rules;

  out.products=Array.isArray(s.products)?s.products.map(p=>({id:p.id||uid(),name:String(p.name||'Unnamed Product').slice(0,140),category:String(p.category||'General').slice(0,100),price:round2(p.price),notes:String(p.notes||'').slice(0,2000),defaultRuleId:ruleIds.has(p.defaultRuleId)?p.defaultRuleId:fallbackRule,active:p.active!==false})):base.products;
  if(!out.products.length) out.products=base.products;
  const productIds=new Set(out.products.map(p=>p.id)); const fallbackProduct=out.products[0].id;
  out.txns=Array.isArray(s.txns)?s.txns.map(t=>({id:t.id||uid(),at:validDate(t.at)?new Date(t.at).toISOString():nowISO(),productId:productIds.has(t.productId)?t.productId:fallbackProduct,ruleId:ruleIds.has(t.ruleId)?t.ruleId:fallbackRule,amount:round2(t.amount),currency:String(t.currency||out.settings.currency||'USD').toUpperCase().slice(0,3),memo:String(t.memo||'').slice(0,3000),tags:String(t.tags||'').slice(0,500),status:['open','settled','void'].includes(t.status)?t.status:'open',externalRef:String(t.externalRef||'').slice(0,180)})):base.txns;

  out.updatedAt=s.updatedAt||nowISO(); out.createdAt=s.createdAt||nowISO(); return out;
}
function validDate(v){const d=new Date(v);return !Number.isNaN(d.getTime())}
function migrateOld(){for(const k of OLD_KEYS){const raw=localStorage.getItem(k);if(raw && !localStorage.getItem(STORE_KEY)){localStorage.setItem(STORE_KEY,raw);break}}}
function loadState(){migrateOld();return normalizeState(safeParse(localStorage.getItem(STORE_KEY),null))}

function logEvent(type,message){state.events.push({at:nowISO(),type,message});state.events=state.events.slice(-100)}

function snapshots(){return safeParse(localStorage.getItem(SNAP_KEY),'') || []}
function makeSnapshot(reason='manual'){const snaps=snapshots();snaps.unshift({id:uid(),at:nowISO(),reason,state});localStorage.setItem(SNAP_KEY,JSON.stringify(snaps.slice(0,12)));}
function restoreSnapshot(id){const snap=snapshots().find(x=>x.id===id);if(!snap)return toast('Snapshot not found');state=normalizeState(snap.state);logEvent('restore','Restored snapshot from '+fmtDate(snap.at));save('Snapshot restored');render()}
const byId=(arr,id)=>arr.find(x=>x.id===id)||null;

function computeSplit(amount,rule,ccy=currency()){
  const A=round2(amount); const lines=Array.isArray(rule?.lines)?rule.lines:[]; const results=[]; let fixedTotal=0,percentTotal=0,remainderLine=null; const warnings=[];
  for(const line of lines){const type=line.type; const value=round2(line.value); const personId=line.personId;
    if(type==='fixed'){const payout=Math.max(0,value);fixedTotal+=payout;results.push({personId,basis:'fixed',value,payout});}
    else if(type==='percent'){const pct=clamp(value,0,100);percentTotal+=pct;results.push({personId,basis:'percent',value:pct,payout:(A*pct)/100});}
    else if(type==='remainder' && !remainderLine){remainderLine={personId,basis:'remainder',value:0,payout:0};}
    else if(type==='remainder' && remainderLine){warnings.push('Multiple remainder lines detected. First remainder line was used.');}
  }
  if(percentTotal>100){warnings.push('Percent total exceeds 100%. Percent lines were scaled proportionally.'); const scale=100/percentTotal; for(const r of results){if(r.basis==='percent')r.payout=(A*(r.value*scale))/100}}
  const before=results.reduce((s,r)=>s+r.payout,0); let remainder=round2(A-before);
  if(remainder<0){warnings.push('Fixed + percent payouts exceed the amount. Remainder forced to 0.'); remainder=0;}
  if(remainderLine){remainderLine.payout=remainder;results.push(remainderLine)} else if(remainder!==0){warnings.push('No remainder line found. Unallocated amount is shown as Unassigned.');results.push({personId:null,basis:'unassigned',value:0,payout:remainder})}
  for(const r of results)r.payout=round2(r.payout); const sum=round2(results.reduce((s,r)=>s+r.payout,0)); const delta=round2(A-sum); if(Math.abs(delta)>=.01){const target=results.find(r=>r.basis==='remainder'||r.basis==='unassigned')||results[results.length-1]; if(target)target.payout=round2(target.payout+delta)}
  return {amount:A,currency:ccy,results,warnings,fixedTotal:round2(fixedTotal),percentTotal:round2(percentTotal),totalPayout:round2(results.reduce((s,r)=>s+r.payout,0))};
}
function ruleHealth(rule){const pct=(rule.lines||[]).filter(l=>l.type==='percent').reduce((s,l)=>s+num(l.value),0);const rem=(rule.lines||[]).filter(l=>l.type==='remainder').length;const bad=(rule.lines||[]).filter(l=>!byId(state.people,l.personId)).length;const issues=[];if(pct>100)issues.push('percent > 100');if(!rem)issues.push('no remainder');if(rem>1)issues.push('multiple remainders');if(bad)issues.push('missing person');return {pct:round2(pct),rem,issues}}

function totalsFor(days=null){const cutoff=days?Date.now()-days*86400000:0;const txns=state.txns.filter(t=>t.status!=='void' && (!cutoff || new Date(t.at).getTime()>=cutoff));let gross=0,payout=0,open=0,settled=0;const per=new Map();for(const t of txns){gross+=num(t.amount);if(t.status==='settled')settled++;else open++;const out=computeSplit(t.amount,byId(state.rules,t.ruleId),t.currency);for(const r of out.results){payout+=r.payout;const k=r.personId||'UNASSIGNED';per.set(k,round2((per.get(k)||0)+r.payout))}}return {count:txns.length,gross:round2(gross),payout:round2(payout),open,settled,per}}

r.lines.push({id:uid(),personId:state.people[0]?.id,type:'percent',value:10});drawLines()};$('#addFixed').onclick=()=>{r.lines.push({id:uid(),personId:state.people[0]?.id,type:'fixed',value:100});drawLines()};$('#addRem').onclick=()=>{r.lines.push({id:uid(),personId:state.people[0]?.id,type:'remainder',value:0});drawLines()};$('#sr_test').oninput=drawPreview;$('#sr_ccy').oninput=drawPreview;drawLines()}
function deleteRule(id,fromModal=false){if(state.rules.length<=1)return toast('Keep at least one rule');if(state.products.some(p=>p.defaultRuleId===id)||state.txns.some(t=>t.ruleId===id))return toast('Rule is in use by products or transactions');if(!confirm('Delete this rule?'))return;state.rules=state.rules.filter(r=>r.id!==id);save('Rule deleted');if(fromModal)closeModal();render()}
function viewBackup(){const bytes=new Blob([JSON.stringify(state)]).size;const snaps=snapshots();return `<div class="grid cols2"><div class="card"><div class="cardTitle"><div><div class="t">Backup / Restore</div><div class="small">Local-first means exports are the source of truth.</div></div><span class="pill ok">${Math.ceil(bytes/1024)} KB</span></div><div class="stack noPrint"><button class="btn primary" id="backupJson">Download Full JSON Backup</button><button class="btn" id="restoreJson">Restore JSON Backup</button><input type="file" id="restoreFile" accept="application/json" hidden><button class="btn" id="exportAllTxns">Export Transactions CSV</button><button class="btn" id="exportAllLines">Export Detailed Payout Lines CSV</button><button class="btn gold" id="doctorBtn">Run Data Doctor</button><button class="btn danger" id="wipeBtn">Wipe Local Data</button></div></div><div class="card"><div class="cardTitle"><div><div class="t">Settings</div><div class="small">Local device settings only.</div></div><span class="pill info">Schema ${state.schemaVersion}</span></div><div class="grid cols2"><label><div class="small">Default Currency</div><input id="set_ccy" class="input" maxlength="3" value="${esc(currency())}"></label><label><div class="small">Default Report Days</div><input id="set_days" class="input" type="number" min="1" max="3650" value="${esc(state.settings.defaultRangeDays)}"></label><label><div class="small">Brand Label</div><input id="set_brand" class="input" value="${esc(state.settings.brand||APP)}"></label><label><div class="small">Auto Snapshot</div><select id="set_snap" class="input"><option value="true" ${state.settings.autoSnapshot?'selected':''}>on</option><option value="false" ${!state.settings.autoSnapshot?'selected':''}>off</option></select></label></div><div class="spacer"></div><button class="btn primary noPrint" id="saveSettings">Save Settings</button></div></div><div class="spacer"></div><div class="card"><div class="cardTitle"><div><div class="t">Snapshots</div><div class="small">Last 12 restore points.</div></div><button class="btn gold noPrint" id="makeSnapshot">Create Snapshot</button></div>${snaps.length?table(['When','Reason','Action'],snaps.map(s=>[fmtDate(s.at),s.reason,`<button class="btn" data-restore-snap="${esc(s.id)}">Restore</button>`])):'<div class="empty">No snapshots yet.</div>'}</div><div class="spacer"></div><div class="card"><div class="cardTitle"><div><div class="t">Event Log</div><div class="small">Recent local data operations.</div></div><span class="pill">${state.events.length}</span></div>${state.events.length?table(['Time','Type','Message'],state.events.slice().reverse().slice(0,30).map(e=>[fmtDate(e.at),e.type,e.message])):'<div class="empty">No events logged yet.</div>'}</div>`}
function wireBackup(){$('#backupJson').onclick=doBackup;$('#restoreJson').onclick=()=>$('#restoreFile').click();$('#restoreFile').onchange=async e=>{const f=e.target.files?.[0];if(!f)return;const txt=await f.text();const incoming=safeParse(txt,null);if(!incoming)return toast('Invalid JSON');if(!confirm('Restore this backup over current local data?'))return;makeSnapshot('before restore');state=normalizeState(incoming);logEvent('restore','Restored JSON backup '+f.name);save('Backup restored');render()};$('#exportAllTxns').onclick=exportTxnsCSV;$('#exportAllLines').onclick=exportAllLinesCSV;$('#doctorBtn').onclick=()=>{makeSnapshot('before data doctor');state=normalizeState(state);logEvent('doctor','Data Doctor normalized local state');save('Data Doctor complete');render()};$('#wipeBtn').onclick=()=>{if(!confirm('Wipe all local data? A snapshot will be created first.'))return;makeSnapshot('before wipe');state=blankState();logEvent('wipe','Local data reset');save('Local data reset');render()};$('#saveSettings').onclick=()=>{state.settings.currency=($('#set_ccy').value||'USD').toUpperCase().slice(0,3);state.settings.defaultRangeDays=clamp(num($('#set_days').value)||30,1,3650);state.settings.brand=$('#set_brand').value.trim()||APP;state.settings.autoSnapshot=$('#set_snap').value==='true';save('Settings saved');render()};$('#makeSnapshot').onclick=()=>{makeSnapshot('manual');toast('Snapshot created');render()};$$('[data-restore-snap]').forEach(b=>b.onclick=()=>restoreSnapshot(b.dataset.restoreSnap))}
function doBackup(){makeSnapshot('manual backup');downloadFile(`skye-split-backup-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify(state,null,2));logEvent('backup','Downloaded JSON backup');save('Backup downloaded')}
function exportTxnsCSV(){downloadFile(`transactions-${new Date().toISOString().slice(0,10)}.csv`,toCSV([['id','at','status','product','rule','amount','currency','memo','tags','external_ref'],...state.txns.map(t=>[t.id,t.at,t.status,productName(t.productId),ruleName(t.ruleId),t.amount,t.currency,t.memo,t.tags,t.externalRef])]),'text/csv')}
function exportAllLinesCSV(){const rows=[['txn_id','at','status','product','rule','amount','person','basis','value','payout','currency','memo']];for(const t of state.txns){const out=computeSplit(t.amount,byId(state.rules,t.ruleId),t.currency);for(const line of out.results)rows.push([t.id,t.at,t.status,productName(t.productId),ruleName(t.ruleId),t.amount,line.personId?peopleName(line.personId):'Unassigned',line.basis,line.value,line.payout,t.currency,t.memo])}downloadFile(`payout-lines-${new Date().toISOString().slice(0,10)}.csv`,toCSV(rows),'text/csv')}
function exportSingleTxnCSV(id){const t=byId(state.txns,id);if(!t)return;const out=computeSplit(t.amount,byId(state.rules,t.ruleId),t.currency);downloadFile(`transaction-${id.slice(0,8)}.csv`,toCSV([['txn_id','at','product','rule','amount','currency','person','basis','value','payout','memo'],...out.results.map(l=>[t.id,t.at,productName(t.productId),ruleName(t.ruleId),t.amount,t.currency,l.personId?peopleName(l.personId):'Unassigned',l.basis,l.value,l.payout,t.memo])]),'text/csv')}
async function importTxnCSV(e){const file=e.target.files?.[0];if(!file)return;const txt=await file.text();const lines=parseCSV(txt);if(lines.length<2)return toast('CSV has no rows');const header=lines[0].map(x=>x.toLowerCase().trim());const idx=n=>header.indexOf(n);let added=0;for(const row of lines.slice(1)){const amount=round2(row[idx('amount')]||row[3]);if(!amount)continue;const productText=row[idx('product')]||'';let p=state.products.find(x=>x.name.toLowerCase()===productText.toLowerCase())||state.products[0];const ruleText=row[idx('rule')]||'';let r=state.rules.find(x=>x.name.toLowerCase()===ruleText.toLowerCase())||byId(state.rules,p.defaultRuleId)||state.rules[0];state.txns.unshift({id:uid(),at:validDate(row[idx('at')])?new Date(row[idx('at')]).toISOString():nowISO(),productId:p.id,ruleId:r.id,amount,currency:(row[idx('currency')]||currency()).toUpperCase().slice(0,3),memo:row[idx('memo')]||'',tags:row[idx('tags')]||'',status:['open','settled','void'].includes(row[idx('status')])?row[idx('status')]:'open',externalRef:row[idx('external_ref')]||''});added++}logEvent('import','Imported '+added+' transaction rows from CSV');save(`Imported ${added} rows`);render()}
function parseCSV(text){const rows=[];let row=[],cur='',q=false;for(let i=0;i<text.length;i++){const c=text[i],n=text[i+1];if(q&&c==='"'&&n==='"'){cur+='"';i++;continue}if(c==='"'){q=!q;continue}if(!q&&c===','){row.push(cur);cur='';continue}if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&n==='\n')i++;row.push(cur);if(row.some(x=>x!==''))rows.push(row);row=[];cur='';continue}cur+=c}row.push(cur);if(row.some(x=>x!==''))rows.push(row);return rows}
function openModal({title,sub,bodyHTML,onSave,onDelete,showDelete=false}){$('#modalTitle').textContent=title;$('#modalSub').textContent=sub||'';$('#modalBody').innerHTML=bodyHTML;$('#saveModal').onclick=onSave||closeModal;$('#deleteModal').style.display=showDelete?'inline-flex':'none';$('#deleteModal').onclick=onDelete||null;$('#modalBackdrop').classList.add('show');$('#modalBackdrop').setAttribute('aria-hidden','false')}function closeModal(){$('#modalBackdrop').classList.remove('show');$('#modalBackdrop').setAttribute('aria-hidden','true');$('#modalBody').innerHTML='';$('#saveModal').onclick=null;$('#deleteModal').onclick=null}
$('#closeModal').onclick=closeModal;$('#modalBackdrop').onclick=e=>{if(e.target.id==='modalBackdrop')closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#globalSearch').focus()}if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='n'){e.preventDefault();openTxn()}});
$('#globalSearch').oninput=()=>{if(['txns','people','products','rules'].includes(active))render()};$('#quickTxn').onclick=()=>openTxn();$('#newTxnBtn').onclick=()=>openTxn();$('#calcBtn').onclick=()=>{active='calc';render()};$('#quickBackup').onclick=doBackup;$('#quickCsv').onclick=exportTxnsCSV;
window.SSE={goto:id=>{active=id;render()},openTxn,backup:doBackup};
let deferredPrompt=null;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('#installBtn').style.display='inline-flex'});$('#installBtn').onclick=async()=>{if(!deferredPrompt)return;deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;$('#installBtn').style.display='none'};
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}
(function fx(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const canvas=$('#field'); if(!canvas) return;
  const ctx=canvas.getContext('2d',{alpha:true});
  const aurora=$('#aurora');
  let w=0,h=0,dpr=1,stars=[],runes=[],bursts=[],mx=innerWidth/2,my=innerHeight/2,frame=0,live=!document.hidden;
  function resize(){
    dpr=Math.min(2,devicePixelRatio||1);w=canvas.width=Math.floor(innerWidth*dpr);h=canvas.height=Math.floor(innerHeight*dpr);
    const count=reduce?40:Math.max(90,Math.min(290,Math.floor(innerWidth*innerHeight/19000)));
    stars=Array.from({length:count},()=>({x:Math.random()*w,y:Math.random()*h,r:(Math.random()*1.55+.20)*dpr,s:(Math.random()*.28+.035)*dpr,t:Math.random()*6.28,hue:Math.random()}));
    runes=Array.from({length:reduce?3:12},()=>({x:Math.random()*w,y:Math.random()*h,v:(Math.random()*.34+.11)*dpr,a:Math.random()*6.28,len:(Math.random()*50+34)*dpr}));
  }
  addEventListener('resize',resize,{passive:true});resize();
  addEventListener('pointermove',e=>{mx=e.clientX;my=e.clientY;if(aurora)aurora.style.transform=`translate(${mx}px,${my}px) translate(-50%,-50%)`},{passive:true});
  addEventListener('pointerdown',e=>{if(reduce)return;bursts.push({x:e.clientX*dpr,y:e.clientY*dpr,r:0,a:.85});const sp=document.createElement('span');sp.className='pageSpark';sp.style.left=e.clientX+'px';sp.style.top=e.clientY+'px';document.body.appendChild(sp);setTimeout(()=>sp.remove(),820)},{passive:true});
  document.addEventListener('visibilitychange',()=>{live=!document.hidden;if(live)requestAnimationFrame(tick)});
  function strokeLine(x,y,len,angle,alpha,color){ctx.save();ctx.translate(x,y);ctx.rotate(angle);ctx.strokeStyle=color.replace('ALPHA',alpha.toFixed(3));ctx.lineWidth=1*dpr;ctx.beginPath();ctx.moveTo(-len/2,0);ctx.lineTo(len/2,0);ctx.stroke();ctx.restore()}
  function tick(){
    if(!live)return;frame++;
    ctx.clearRect(0,0,w,h);
    const px=mx*dpr, py=my*dpr;
    const g=ctx.createRadialGradient(px,py,0,px,py,Math.max(w,h)*.34);g.addColorStop(0,'rgba(139,92,246,.115)');g.addColorStop(.35,'rgba(96,165,250,.055)');g.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);
    for(const st of stars){st.t+=.018;st.y+=st.s;st.x+=Math.sin(st.t)*.07*dpr;if(st.y>h+8){st.y=-8;st.x=Math.random()*w}const tw=.20+.55*(.5+.5*Math.sin(st.t));ctx.fillStyle=st.hue>.76?`rgba(247,201,72,${tw*.75})`:st.hue>.48?`rgba(96,165,250,${tw})`:`rgba(250,245,255,${tw})`;ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,Math.PI*2);ctx.fill()}
    for(const r of runes){r.x+=Math.cos(r.a)*r.v;r.y+=Math.sin(r.a)*r.v;if(r.x<-80||r.x>w+80||r.y<-80||r.y>h+80){r.x=Math.random()*w;r.y=Math.random()*h;r.a=Math.random()*6.28}strokeLine(r.x,r.y,r.len,r.a,.18+.14*Math.sin(frame*.018+r.a),'rgba(247,201,72,ALPHA)');strokeLine(r.x+12*dpr,r.y+8*dpr,r.len*.55,r.a+.35,.10,'rgba(139,92,246,ALPHA)')}
    bursts=bursts.filter(b=>b.a>.02);for(const b of bursts){b.r+=10*dpr;b.a*=.88;ctx.strokeStyle=`rgba(247,201,72,${b.a})`;ctx.lineWidth=2*dpr;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=`rgba(96,165,250,${b.a*.55})`;ctx.beginPath();ctx.arc(b.x,b.y,b.r*.56,0,Math.PI*2);ctx.stroke()}
    requestAnimationFrame(tick)
  }
  if(!reduce)tick();
})();
if(state.settings.autoSnapshot && !sessionStorage.getItem('SSE_OPEN_SNAPSHOT')){try{makeSnapshot('session open');sessionStorage.setItem('SSE_OPEN_SNAPSHOT','1')}catch{}}
render();
})();
