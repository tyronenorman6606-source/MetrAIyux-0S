<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AE Profile | MetrAIyux 0S</title>
  <link rel="icon" type="image/png" href="../favicon-32.png">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="./ae-command.css">
  <script src="/Free99/free99-gate.js" data-platform-id="routex-ae-command" data-platform-name="AE Workforce Command" data-billing-mode="gate_owned" data-price-label="0S shared FS27/SkyGate session required" data-app-root="/ae-command/"></script>
</head>
<body class="ae-command-page profile-page" data-platform-id="routex-ae-command">
  <header class="site-header ae-topbar">
    <a class="brand" href="./index.html">
      <img class="brand-logo floating-logo" src="../assets/metraiyux-0s-emblem-transparent.png" alt="MetrAIyux 0S emblem">
      <span class="brand-text">AE Workforce</span>
    </a>
    <nav>
      <a href="./index.html">AE Command</a>
      <a href="../SkyeRouteX/workforce-command-v0.4.0/index.html">RouteX</a>
      <a href="../Free99/apps/sovereigndocs/">SovereignDocs</a>
    </nav>
  </header>

  <main class="ae-shell">
    <section id="profileShell" class="ae-command-hero">
      <div>
        <p class="eyebrow">AE profile</p>
        <h1 id="profileName">Loading profile</h1>
        <p id="profileBio" class="hero-lede">Checking the shared 0S gate and RouteX profile registry.</p>
      </div>
      <aside class="ae-status-panel">
        <span>Status</span>
        <strong id="profileStatus">loading</strong>
        <a id="workforceLink" class="buttonlike" href="../SkyeRouteX/workforce-command-v0.4.0/index.html">Open Workforce</a>
      </aside>
    </section>

    <section class="ae-grid three">
      <section class="ae-panel">
        <p class="eyebrow">Skills</p>
        <h2>Can Execute</h2>
        <div id="skills" class="ae-list compact"></div>
      </section>
      <section class="ae-panel">
        <p class="eyebrow">Services</p>
        <h2>Can Sell</h2>
        <div id="services" class="ae-list compact"></div>
      </section>
      <section class="ae-panel">
        <p class="eyebrow">Compliance</p>
        <h2>Workspace State</h2>
        <div id="workspaceState" class="profile-output"></div>
      </section>
    </section>

    <section class="ae-panel">
      <div class="section-head">
        <div>
          <p class="eyebrow">Workspace links</p>
          <h2>0S Surfaces</h2>
        </div>
        <a class="buttonlike" href="./index.html">Back to AE Command</a>
      </div>
      <div id="workspaceLinks" class="ae-list"></div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="../assets/js/metraiyux-api-bases.js"></script>
  <script src="./profile.js" type="module"></script>
</body>
</html>
