    <path d="M128 69 187 128 128 187 69 128 128 69Z" stroke="#f5c542" stroke-width="7" opacity=".88"/>
    <path d="M83 128h90M128 83v90" stroke="#ffffff" stroke-width="7" opacity=".72"/>
