<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">skAIxu Code Evaluator mark</title>
  <desc id="desc">Glowing geometric sigil for the skAIxu Code Evaluator Platform.</desc>
  <defs>
    <radialGradient id="g1" cx="34%" cy="30%" r="55%"><stop offset="0" stop-color="#f5c542"/><stop offset="1" stop-color="#f5c542" stop-opacity="0"/></radialGradient>
    <radialGradient id="g2" cx="70%" cy="68%" r="62%"><stop offset="0" stop-color="#a855f7"/><stop offset="1" stop-color="#a855f7" stop-opacity="0"/></radialGradient>
    <radialGradient id="g3" cx="54%" cy="48%" r="70%"><stop offset="0" stop-color="#57c7ff" stop-opacity=".78"/><stop offset="1" stop-color="#57c7ff" stop-opacity="0"/></radialGradient>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2b1744"/><stop offset="1" stop-color="#080410"/></linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="8" result="blur"/><feColorMatrix in="blur" type="matrix" values="1 0 0 0 0.66 0 1 0 0 0.33 0 0 1 0 0.97 0 0 0 .55 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
