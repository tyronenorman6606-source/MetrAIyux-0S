  <circle cx="168" cy="170" r="90" fill="url(#g2)"/>
  <circle cx="132" cy="122" r="108" fill="url(#g3)"/>
  <g filter="url(#glow)" fill="none" stroke-linecap="round" stroke-linejoin="round">
