<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>kAIxU CodeStudio Charts</title>
  <style>
    body{margin:0;min-height:100vh;background:#080b10;color:#eff6ff;font-family:Inter,system-ui,sans-serif}
    main{width:min(980px,calc(100vw - 32px));margin:0 auto;padding:40px 0}
    a{color:#8bdcff}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin-top:20px}
    .card{border:1px solid rgba(255,255,255,.14);border-radius:8px;padding:16px;background:rgba(255,255,255,.06)}
  </style>
</head>
<body>
  <main>
    <p><a href="../index.html">Back to reports</a></p>
    <h1>Charts Folder</h1>
    <p>Generated report charts are served from this folder for operator review.</p>
    <section class="grid" aria-label="Available chart assets">
      <a class="card" href="./readiness_score.png">Readiness Score</a>
      <a class="card" href="./replacement_cost.png">Replacement Cost</a>
      <a class="card" href="./hours_breakdown.png">Hours Breakdown</a>
      <a class="card" href="./loc_by_file.png">LOC By File</a>
      <a class="card" href="./asset_sizes.png">Asset Sizes</a>
      <a class="card" href="./arr_multiple_valuation_ranges.png">ARR Valuation Ranges</a>
    </section>
  </main>
</body>
</html>
