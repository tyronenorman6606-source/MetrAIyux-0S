# Optional production override: healthchecks, logging limits, restart discipline.
# Use with: docker compose -f docker-compose.yml -f docker-compose.prod.override.yml up -d
services:
  hub:
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 10s
      retries: 5
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  freescout:
    logging: *default-logging
  freescout-db:
    logging: *default-logging
  espocrm:
    logging: *default-logging
  espocrm-db:
    logging: *default-logging
  invoiceshelf:
    logging: *default-logging
  invoiceshelf-db:
    logging: *default-logging
  formbricks:
    logging: *default-logging
  formbricks-db:
    logging: *default-logging
