<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#03040d" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Neon Rift" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Neon Rift Duel is a phone-first space-fighter boss rush with drag movement, rail strikes, blasts, guard parries, rift shots, full supers, pickups, hazards, waves, and arcade combo scoring." />
    <meta property="og:title" content="Neon Rift Duel" />
    <meta property="og:description" content="A mobile arcade space-fighter boss rush. No rows, no grid: move, dodge, strike, blast, guard, parry, and fire Rift supers." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="assets/social-card.svg" />
    <title>Neon Rift Duel</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="assets/icon-192.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell duel-shell" id="appShell">
      <main class="duel-layout">
        <section class="score-strip duel-stats" aria-label="Run stats">
          <article><span>Score</span><strong id="score">0</strong></article>
          <article><span>Wave</span><strong id="level">1</strong></article>
          <article><span>Combo</span><strong id="combo">0</strong></article>
          <article><span>Hull</span><strong id="lines">100</strong></article>
        </section>

        <section class="arena-card duel-arena" aria-label="Neon Rift Duel arena">
          <div class="status-row duel-status">
            <div class="status-copy">
              <span id="modeLabel">Neon Rift Duel</span>
              <strong id="missionText">Drag ship. Strike, Blast, Guard, Super.</strong>
            </div>
            <div class="status-buttons">
              <button id="muteBtn" class="icon-btn" type="button" aria-label="Toggle sound">SFX</button>
              <button id="pauseBtn" class="icon-btn" type="button" aria-label="Pause game">PAUSE</button>
            </div>
          </div>

          <div class="rift-zone duel-rift">
            <div class="rift-head">
              <span id="riftLabel">Rift charging</span>
              <b id="riftValue">0%</b>
            </div>
            <div class="rift-meter" aria-hidden="true"><div id="riftFill"></div></div>
          </div>

          <div class="board-stage duel-stage" id="boardStage">
            <canvas id="gameCanvas" width="390" height="720" aria-label="Neon Rift Duel game canvas"></canvas>
            <div id="overlay" class="overlay active" aria-live="polite">
              <div class="overlay-panel" id="overlayPanel">
                <p class="eyebrow" id="overlayKicker">Mobile arcade boss rush</p>
                <h2 id="overlayTitle">Neon Rift Duel</h2>
                <p id="overlayCopy">Drag the ship. Strike up close, Blast from range, Guard to parry, and spend Rift on shots or full supers. This is not a falling-block game.</p>
                <div class="overlay-actions">
                  <button id="primaryBtn" class="primary-btn" type="button">Launch Duel</button>
                  <button id="howBtn" class="secondary-btn" type="button">Controls</button>
                </div>
              </div>
            </div>
            <div id="toast" class="toast" aria-live="polite"></div>
          </div>
        </section>
      </main>

      <nav class="touch-controls duel-controls" aria-label="Touch controls">
        <button id="holdBtn" type="button"><span>Guard</span><b>G</b></button>
        <button id="leftBtn" type="button"><span>Dash L</span><b>&lt;</b></button>
        <button id="rotateBtn" class="large" type="button"><span>Blast</span><b>B</b></button>
        <button id="rightBtn" type="button"><span>Dash R</span><b>&gt;</b></button>
        <button id="dropBtn" type="button"><span>Strike</span><b>S</b></button>
        <button id="riftMobileBtn" class="rift-mobile" type="button"><span>Super</span><b>R</b></button>
      </nav>
    </div>

    <script src="game.js" defer></script>
  </body>
</html>
