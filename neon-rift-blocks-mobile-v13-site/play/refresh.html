<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>Refreshing Neon Rift Duel</title>
    <style>
      html,
      body {
        min-height: 100%;
        margin: 0;
        display: grid;
        place-items: center;
        background: #02030a;
        color: #f8fbff;
        font-family: system-ui, sans-serif;
      }

      main {
        width: min(86vw, 360px);
        text-align: center;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 28px;
      }

      p {
        margin: 0;
        color: #9aa7c3;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Loading Neon Rift Duel</h1>
      <p>Clearing the old mobile cache and opening the action build.</p>
    </main>
    <script>
      (async () => {
        try {
          const regs = await navigator.serviceWorker?.getRegistrations?.() || [];
          await Promise.all(regs.map((reg) => reg.unregister()));
          const keys = await caches?.keys?.() || [];
          await Promise.all(keys.map((key) => caches.delete(key)));
        } catch (_) {}
        location.replace('./?v=duel-v16-2-' + Date.now());
      })();
    </script>
  </body>
</html>
