<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Client App Runtime</title>
  <meta name="description" content="Runtime-generated client app delivered from the 0S Client App Factory.">
  <meta name="theme-color" content="#0a0f1b">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="runtime-shell">
    <header class="runtime-topbar">
      <a class="runtime-brand" data-home-link href="./index.html">
        <span class="runtime-brand-mark" data-brand-mark aria-hidden="true"></span>
        <span class="runtime-brand-wordmark" data-brand-name>Client App</span>
      </a>
      <nav class="runtime-nav" data-nav></nav>
      <div class="runtime-topbar-actions">
        <a class="runtime-button ghost" data-live-link target="_blank" rel="noreferrer">Live Surface</a>
        <a class="runtime-button" data-book-link target="_blank" rel="noreferrer">Book / Buy</a>
      </div>
    </header>

    <main data-app-root>
      <section class="runtime-loading">
        <div class="runtime-loader-card">
          <p class="eyebrow">Client App Factory Runtime</p>
          <h1>Loading generated client app…</h1>
          <p>We’re pulling the client record, live-surface profile, and route wiring from the mounted 0S factory.</p>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
