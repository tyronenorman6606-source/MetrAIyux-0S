[build]
  publish = "."

[[headers]]
  for = "service-worker.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "assets/media/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "assets/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[redirects]]
  from = "/request-a-quote"
  to = "quote.html"
  status = 301

[[redirects]]
  from = "/scan"
  to = "scan.html"
  status = 301

[[redirects]]
  from = "/qr"
  to = "scan.html"
  status = 301

[[redirects]]
  from = "/preview"
  to = "preview.html"
  status = 301
