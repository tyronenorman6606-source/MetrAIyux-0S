[public_surfaces]
no_feature_narration = true
professional_instrument_first = true
rule = "Public-facing legal, operations, contract, and tool surfaces must open as the usable instrument or workflow itself. Do not display copy that explains what Codex built, restates the owner request, advertises that a route generates a document, or tells users how obvious controls work. Use professional labels, legal clauses, form fields, packet indexes, required notices, and execution language."

[public_surfaces.allowed]
labels = [
  "Print Contract",
  "Download Text",
  "Rider Fields",
  "Packet Index",
  "Tenant legal name",
  "Legal reviewer / counsel",
  "Execution Copy"
]

[public_surfaces.blocked]
phrases = [
  "This route generates",
  "What this produces",
  "Fill it out in the field",
  "Make them sign",
  "built for live deal closing",
  "Use this page",
  "This page explains",
  "how to use"
]
