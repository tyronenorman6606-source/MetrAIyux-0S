<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-labelledby="title desc">
  <title id="title">SkyeVault autosync daemon founder blog screenshot</title>
  <desc id="desc">Preview of the founder note titled ShYT happens. Skye keeps the sKache.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050608"/>
      <stop offset="0.48" stop-color="#0b1014"/>
      <stop offset="1" stop-color="#050608"/>
    </linearGradient>
    <radialGradient id="cyan" cx="18%" cy="14%" r="42%">
      <stop offset="0" stop-color="#64d9ff" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#64d9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="82%" cy="10%" r="38%">
      <stop offset="0" stop-color="#f4c75b" stop-opacity="0.23"/>
      <stop offset="1" stop-color="#f4c75b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="violet" cx="78%" cy="82%" r="46%">
      <stop offset="0" stop-color="#a88cff" stop-opacity="0.21"/>
      <stop offset="1" stop-color="#a88cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <style>
      .brand{font-weight:900;font-size:24px;font-family:Arial,sans-serif;fill:#f4f0e8;letter-spacing:.5px}
      .nav{font-weight:700;font-size:17px;font-family:Arial,sans-serif;fill:#d8e0ea}
      .eyebrow{font-weight:800;font-size:17px;font-family:Arial,sans-serif;fill:#f4c75b;letter-spacing:3px}
      .headline{font-weight:900;font-size:82px;font-family:Arial,sans-serif;fill:#f4f0e8;letter-spacing:-2px}
      .headlineGold{fill:#f4c75b}
      .lede{font-weight:400;font-size:28px;font-family:Arial,sans-serif;fill:#d8e0ea}
      .quote{font-weight:700;font-size:32px;font-family:Arial,sans-serif;fill:#f4f0e8}
      .small{font-weight:400;font-size:18px;font-family:Arial,sans-serif;fill:#d8e0ea}
      .tileTitle{font-weight:800;font-size:23px;font-family:Arial,sans-serif;fill:#f4f0e8}
      .tileCopy{font-weight:400;font-size:17px;font-family:Arial,sans-serif;fill:#d8e0ea}
      .railTitle{font-weight:800;font-size:22px;font-family:Arial,sans-serif;fill:#f4c75b}
      .railCopy{font-weight:400;font-size:18px;font-family:Arial,sans-serif;fill:#d8e0ea}
      .pill{font-weight:800;font-size:16px;font-family:Arial,sans-serif;fill:#f4c75b}
    </style>
  </defs>
  <rect width="1440" height="1040" fill="url(#bg)"/>
  <rect width="1440" height="1040" fill="url(#cyan)"/>
  <rect width="1440" height="1040" fill="url(#gold)"/>
  <rect width="1440" height="1040" fill="url(#violet)"/>
  <g opacity="0.12" stroke="#fff" stroke-width="1">
    <path d="M0 0V1040M72 0V1040M144 0V1040M216 0V1040M288 0V1040M360 0V1040M432 0V1040M504 0V1040M576 0V1040M648 0V1040M720 0V1040M792 0V1040M864 0V1040M936 0V1040M1008 0V1040M1080 0V1040M1152 0V1040M1224 0V1040M1296 0V1040M1368 0V1040"/>
    <path d="M0 0H1440M0 72H1440M0 144H1440M0 216H1440M0 288H1440M0 360H1440M0 432H1440M0 504H1440M0 576H1440M0 648H1440M0 720H1440M0 792H1440M0 864H1440M0 936H1440M0 1008H1440"/>
  </g>
  <g transform="translate(92 58)">
    <g>
      <circle cx="26" cy="26" r="26" fill="#050608" stroke="#f4c75b" stroke-width="2"/>
      <circle cx="26" cy="26" r="16" fill="#64d9ff" opacity="0.62"/>
      <text class="brand" x="68" y="34">MetrAIyux 0S</text>
      <text class="nav" x="770" y="32">Founder Drops</text>
      <text class="nav" x="928" y="32">Proof Ecology</text>
      <text class="nav" x="1086" y="32">SkyeVault Agent</text>
      <line x1="0" y1="76" x2="1256" y2="76" stroke="#a0cde2" stroke-opacity="0.24"/>
    </g>
    <text class="eyebrow" x="0" y="176">FOUNDER NOTE · SKYEVAULT REPO RESCUE</text>
    <text class="headline" x="0" y="286">ShYT happens.</text>
    <text class="headline headlineGold" x="0" y="382">Skye keeps the sKache.</text>
    <text class="lede" x="0" y="462">The encrypted autosync daemon watches the repo, captures tracked</text>
    <text class="lede" x="0" y="502">and untracked source, writes proof receipts, and keeps the last</text>
    <text class="lede" x="0" y="542">clean move recoverable when IDEs or workspaces get messy.</text>
    <g transform="translate(0 590)">
      <rect x="0" y="0" width="820" height="138" fill="#f4c75b" opacity="0.09"/>
      <rect x="0" y="0" width="5" height="138" fill="#f4c75b"/>
      <text class="quote" x="30" y="48">"ShYT may crash, but Skye keeps the sKache."</text>
      <text class="small" x="30" y="88">No perfect-tech promises. Just proof receipts, recovery prompts,</text>
      <text class="small" x="30" y="116">checkpoints, and rollback-aware workflows.</text>
    </g>
    <g transform="translate(0 770)">
      <g>
        <rect width="274" height="122" rx="8" fill="#0b0f14" fill-opacity="0.78" stroke="#a0cde2" stroke-opacity="0.24"/>
        <text class="tileTitle" x="22" y="38">Scan</text>
        <text class="tileCopy" x="22" y="72">Ten-minute checks with</text>
        <text class="tileCopy" x="22" y="96">digest parity.</text>
      </g>
      <g transform="translate(292 0)">
        <rect width="274" height="122" rx="8" fill="#0b0f14" fill-opacity="0.78" stroke="#a0cde2" stroke-opacity="0.24"/>
        <text class="tileTitle" x="22" y="38">Encrypt</text>
        <text class="tileCopy" x="22" y="72">Private custody before</text>
        <text class="tileCopy" x="22" y="96">storage.</text>
      </g>
      <g transform="translate(584 0)">
        <rect width="274" height="122" rx="8" fill="#0b0f14" fill-opacity="0.78" stroke="#a0cde2" stroke-opacity="0.24"/>
        <text class="tileTitle" x="22" y="38">Stream</text>
        <text class="tileCopy" x="22" y="72">Cloudflare-backed</text>
        <text class="tileCopy" x="22" y="96">vault receipts.</text>
      </g>
      <g transform="translate(876 0)">
        <rect width="274" height="122" rx="8" fill="#0b0f14" fill-opacity="0.78" stroke="#a0cde2" stroke-opacity="0.24"/>
        <text class="tileTitle" x="22" y="38">Notify</text>
        <text class="tileCopy" x="22" y="72">Resend alerts with</text>
        <text class="tileCopy" x="22" y="96">recovery links.</text>
      </g>
    </g>
    <g transform="translate(920 212)" filter="url(#softShadow)">
      <rect width="330" height="320" rx="8" fill="#05080c" fill-opacity="0.85" stroke="#a0cde2" stroke-opacity="0.28"/>
      <rect width="330" height="120" rx="8" fill="#f4c75b" fill-opacity="0.12"/>
      <text class="railTitle" x="28" y="162">Direct essay link</text>
      <text class="railCopy" x="28" y="204">Daemons, VS Code,</text>
      <text class="railCopy" x="28" y="232">workspaces, encryption,</text>
      <text class="railCopy" x="28" y="260">and the no-guarantee line.</text>
      <rect x="28" y="282" width="152" height="34" rx="7" fill="none" stroke="#f4c75b" stroke-opacity="0.48"/>
      <text class="pill" x="42" y="305">Read full note</text>
    </g>
  </g>
</svg>
