<!doctype html>
<html data-mcp-neon-scrollbar lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SkyePics Vault · 0S Mount</title>
<style>
    :root{color-scheme:dark;--bg:#061012;--panel:#0f1a1d;--ink:#f8fafc;--muted:#b6c2d3;--line:rgba(255,255,255,.16);--gold:#f8d36a;--green:#72e0a1;--cyan:#7de2ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:linear-gradient(135deg,#061012 0%,#121824 54%,#101112 100%);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    main{width:min(980px,calc(100% - 32px));margin:0 auto;padding:56px 0}
    .eyebrow{margin:0 0 10px;color:var(--gold);font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:0}
    h1{margin:0;font-size:clamp(38px,8vw,76px);line-height:.95;letter-spacing:0}
    .lede{max-width:720px;margin:18px 0 28px;color:var(--muted);font-size:18px;line-height:1.6}
    section{border:1px solid var(--line);border-radius:8px;background:rgba(255,255,255,.045);padding:18px}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}
    a{color:var(--ink);text-decoration:none}
    .button{border:1px solid var(--line);border-radius:8px;padding:11px 13px;font-weight:800;background:rgba(255,255,255,.07)}
    .button.primary{background:var(--gold);border-color:var(--gold);color:#111827}
    code{color:var(--green);white-space:normal}
  </style>
</head>
<body class="skyesol-living-page">
<div class="neon-motion-chrome" data-motion-chrome aria-hidden="true"></div>
<canvas class="living-background skyesol-living-field" aria-hidden="true"></canvas><div class="skyesol-grain" aria-hidden="true"></div><div class="skyesol-scanline" aria-hidden="true"></div>
  <main>
    <p class="eyebrow">Free99 gated app</p>
    <h1 class="neon-gradient-text">SkyePics Vault</h1>
    <p class="lede">Local encrypted photo and OCR vault mounted inside 0S. The app stays no-charge on the core lane while the shared gate still tags usage as <code>platform_id=skyepics</code>.</p>
    <section>
      <strong>FS27/SkyGate session required.</strong>
      <div class="actions">
        <a class="button primary" href="dist/index.html">Open vault</a>
        <a class="button" href="/Free99/index.html">Back to Free99 hub</a>
      </div>
    </section>
  </main>
</body>
</html>
