<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=/Free99/apps/skyebox-authenticator/">
  <link rel="canonical" href="/Free99/apps/skyebox-authenticator/">
  <title>Redirecting to SkyeBox Authenticator</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05070a;
      --panel: rgba(13, 18, 26, 0.82);
      --line: rgba(255, 255, 255, 0.16);
      --text: #f7f3e8;
      --muted: rgba(247, 243, 232, 0.72);
      --gold: #f5c84c;
      --cyan: #5bd6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 24% 18%, rgba(91, 214, 255, 0.18), transparent 28rem),
        linear-gradient(135deg, #05070a, #101825 58%, #090b11);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(92vw, 34rem);
      padding: 2rem;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: 0 22px 80px rgba(0, 0, 0, 0.42);
    }

    .eyebrow {
      margin: 0 0 0.7rem;
      color: var(--gold);
      font-size: 0.74rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      font-size: clamp(1.7rem, 4vw, 2.35rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    p {
      color: var(--muted);
      line-height: 1.7;
    }

    a {
      display: inline-flex;
      min-height: 2.75rem;
      align-items: center;
      justify-content: center;
      margin-top: 0.5rem;
      padding: 0.75rem 1rem;
      border: 1px solid rgba(245, 200, 76, 0.58);
      border-radius: 6px;
      color: #080a0f;
      background: linear-gradient(135deg, var(--gold), var(--cyan));
      font-weight: 800;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Canonical app moved</p>
    <h1>SkyeBox Authenticator now runs from one canonical mount.</h1>
    <p>This HouseOperations compatibility route redirects to the single production vault so the authenticator app code is no longer duplicated across the 0S.</p>
    <a href="/Free99/apps/skyebox-authenticator/">Open canonical SkyeBox Authenticator</a>
  </main>
  <script src="./app.js"></script>
</body>
</html>
