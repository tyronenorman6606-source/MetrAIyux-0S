<!doctype html>
<html data-mcp-neon-scrollbar lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="MetrAIyux 0S operating wrapper preview.">
  <title>MetrAIyux 0S Wrapper Preview</title>
  <link rel="icon" type="image/png" href="../assets/metraiyux-0s-icon-512.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body class="skyesol-living-page os-body">
  <div class="neon-motion-chrome" data-motion-chrome aria-hidden="true"></div>
  <canvas class="living-background skyesol-living-field" aria-hidden="true"></canvas>
  <div class="skyesol-grain" aria-hidden="true"></div>
  <div class="skyesol-scanline" aria-hidden="true"></div>

  <main class="os-shell" aria-label="MetrAIyux 0S preview shell">
    <header class="os-topbar">
      <a class="os-brand" href="../index.html" aria-label="MetrAIyux 0S home">
        <img src="../assets/metraiyux-0s-emblem-transparent.png" alt="">
        <span>MetrAIyux 0S</span>
      </a>
      <div class="os-status" aria-label="Preview status">
        <span>Kernel shell</span>
        <span>Wrapper preview</span>
        <span>19:42 UTC</span>
      </div>
      <button class="os-command-button" type="button" data-command-toggle aria-expanded="false" aria-controls="commandOverlay">Command</button>
    </header>

    <section class="os-desktop" id="desktop" aria-label="MetrAIyux workspace">
      <aside class="os-sidebar neon-glow-panel" aria-label="System summary">
        <div>
          <p class="panel-kicker">Command center</p>
          <h1 class="neon-gradient-text">0S restored.</h1>
        </div>
        <div class="system-stack">
          <span><b>Kernel</b><em>Staged</em></span>
          <span><b>Atlas</b><em>Wrapped</em></span>
          <span><b>Vault</b><em>Sealed</em></span>
        </div>
      </aside>

      <div class="window-layer" aria-label="Laptop windows">
        <article class="mcp-laptop-card is-focused" data-window="kernel" data-open="false" style="--x: 28px; --y: 32px;">
          <div class="window-titlebar" data-drag-handle>
            <span>Kernel launcher</span>
            <button type="button" data-close-window aria-label="Close Kernel launcher">X</button>
          </div>
          <figure class="mcp-macbook-scroll" data-mcp-component="MacbookScroll" data-mcp-source="MCP/skye-design-lab/Compoents/macbook-animation" data-mcp-prop-show-gradient="false" data-mcp-prop-title="Kernel launcher" data-open="false">
            <button class="mcp-macbook-scroll__toggle" type="button" data-laptop-toggle aria-expanded="false" aria-label="Open Kernel launcher laptop">
              <span class="mcp-macbook-scroll__title">Kernel launcher</span>
              <span class="mcp-macbook-scroll__lid macbook-lid">
                <span class="macbook-camera" aria-hidden="true"></span>
                <span class="mcp-macbook-scroll__screen" data-laptop-screen aria-hidden="true">
                  <span class="screen-chrome"><span>0S</span><span>Kernel</span></span>
                  <span class="screen-scroll">
                    <span class="system-mark"><img src="../assets/metraiyux-0s-emblem-transparent.png" alt=""></span>
                    <span class="system-copy"><strong>Kernel</strong><span>Dock launch, wrapper state, command surface.</span></span>
                    <span class="system-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
                  </span>
                  <span class="macbook-screen-gloss" aria-hidden="true"></span>
                </span>
              </span>
              <span class="mcp-macbook-scroll__hinge" aria-hidden="true"><i></i><i></i></span>
              <span class="mcp-macbook-scroll__base macbook-base" aria-hidden="true"><span class="base-notch"></span><span class="base-trackpad"></span></span>
            </button>
          </figure>
        </article>

        <article class="mcp-laptop-card" data-window="atlas" data-open="false" style="--x: 360px; --y: 132px;">
          <div class="window-titlebar" data-drag-handle>
            <span>Atlas room</span>
            <button type="button" data-close-window aria-label="Close Atlas room">X</button>
          </div>
          <figure class="mcp-macbook-scroll" data-mcp-component="MacbookScroll" data-mcp-source="MCP/skye-design-lab/Compoents/macbook-animation" data-mcp-prop-show-gradient="false" data-mcp-prop-title="Atlas room" data-open="false">
            <button class="mcp-macbook-scroll__toggle" type="button" data-laptop-toggle aria-expanded="false" aria-label="Open Atlas room laptop">
              <span class="mcp-macbook-scroll__title">Atlas room</span>
              <span class="mcp-macbook-scroll__lid macbook-lid">
                <span class="macbook-camera" aria-hidden="true"></span>
                <span class="mcp-macbook-scroll__screen" data-laptop-screen aria-hidden="true">
                  <span class="screen-chrome"><span>Atlas</span><span>Map</span></span>
                  <span class="screen-scroll">
                    <span class="system-mark"><img src="../assets/metraiyux-0s-icon-512.png" alt=""></span>
                    <span class="system-copy"><strong>Atlas</strong><span>Rooms, cards, routes, and launch states.</span></span>
                    <span class="system-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
                  </span>
                  <span class="macbook-screen-gloss" aria-hidden="true"></span>
                </span>
              </span>
              <span class="mcp-macbook-scroll__hinge" aria-hidden="true"><i></i><i></i></span>
              <span class="mcp-macbook-scroll__base macbook-base" aria-hidden="true"><span class="base-notch"></span><span class="base-trackpad"></span></span>
            </button>
          </figure>
        </article>

        <article class="mcp-laptop-card" data-window="vault" data-open="false" style="--x: 80px; --y: 540px;">
          <div class="window-titlebar" data-drag-handle>
            <span>Vault console</span>
            <button type="button" data-close-window aria-label="Close Vault console">X</button>
          </div>
          <figure class="mcp-macbook-scroll" data-mcp-component="MacbookScroll" data-mcp-source="MCP/skye-design-lab/Compoents/macbook-animation" data-mcp-prop-show-gradient="false" data-mcp-prop-title="Vault console" data-open="false">
            <button class="mcp-macbook-scroll__toggle" type="button" data-laptop-toggle aria-expanded="false" aria-label="Open Vault console laptop">
              <span class="mcp-macbook-scroll__title">Vault console</span>
              <span class="mcp-macbook-scroll__lid macbook-lid">
                <span class="macbook-camera" aria-hidden="true"></span>
                <span class="mcp-macbook-scroll__screen" data-laptop-screen aria-hidden="true">
                  <span class="screen-chrome"><span>Vault</span><span>Proof</span></span>
                  <span class="screen-scroll">
                    <span class="system-mark"><img src="../assets/metraiyux-0s-logo-transparent.png" alt=""></span>
                    <span class="system-copy"><strong>Vault</strong><span>Proof cards, sealed windows, investor surface.</span></span>
                    <span class="system-tiles" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></span>
                  </span>
                  <span class="macbook-screen-gloss" aria-hidden="true"></span>
                </span>
              </span>
              <span class="mcp-macbook-scroll__hinge" aria-hidden="true"><i></i><i></i></span>
              <span class="mcp-macbook-scroll__base macbook-base" aria-hidden="true"><span class="base-notch"></span><span class="base-trackpad"></span></span>
            </button>
          </figure>
        </article>
      </div>
    </section>

    <nav class="os-dock" aria-label="0S dock">
      <button type="button" data-focus-window="kernel" aria-label="Open Kernel launcher"><span>K</span><em>Kernel</em></button>
      <button type="button" data-focus-window="atlas" aria-label="Open Atlas room"><span>A</span><em>Atlas</em></button>
      <button type="button" data-focus-window="vault" aria-label="Open Vault console"><span>V</span><em>Vault</em></button>
      <button type="button" data-command-toggle aria-label="Open command palette"><span>/</span><em>Command</em></button>
    </nav>
  </main>

  <section class="command-overlay" id="commandOverlay" aria-hidden="true" aria-label="Command palette">
    <div class="command-card neon-glow-panel">
      <div class="command-card__top">
        <span>0S commands</span>
        <button type="button" data-command-close aria-label="Close command palette">X</button>
      </div>
      <button type="button" data-focus-window="kernel">Open Kernel launcher</button>
      <button type="button" data-focus-window="atlas">Open Atlas room</button>
      <button type="button" data-focus-window="vault">Open Vault console</button>
    </div>
  </section>

  <script type="module" src="./preview.js"></script>
</body>
</html>
