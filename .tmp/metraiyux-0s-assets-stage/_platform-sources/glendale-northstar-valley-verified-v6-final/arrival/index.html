<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Opening NorthStar Workspace</title><link rel="stylesheet" href="../assets/styles.css"></head><body><div class="page-glow"></div><div class="noise"></div><main class="arrival-page"><section class="handoff-card"><span class="northstar-badge"><i></i>NorthStar SignInPro</span><h1>Opening the client workspace.</h1><p class="copy">This page connects the landing experience to the central NorthStar app. Each company opens a dedicated workspace inside one shared SignInPro system.</p><a id="handoff-link" class="btn primary" href="../northstar/index.html">Open workspace</a><p class="workspace-link" id="handoff-note"></p></section></main><script>const q=new URLSearchParams(location.search);const slug=q.get('workspace')||q.get('client')||'';const url='../northstar/index.html'+(slug?'?workspace='+encodeURIComponent(slug):'');const link=document.getElementById('handoff-link');const note=document.getElementById('handoff-note');link.href=url;note.textContent=slug?'Workspace: '+slug:'NorthStar workspace login';setTimeout(()=>{location.href=url},550);</script></body></html>
