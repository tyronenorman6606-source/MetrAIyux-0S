name: VantaCore-Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - preview
          - staging

concurrency:
  group: vanta-core-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: production

jobs:
  VantaCore-Preflight:
    name: VantaCore Preflight Validation
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Preflight Check
        run: npm run preflight:strict
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  VantaCore-Deploy-Netlify:
    name: VantaCore-Deploy-Netlify
    runs-on: ubuntu-latest
    needs: VantaCore-Preflight
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: VantaCore Deploy to Netlify
        uses: nwtgck/actions-netlify@v3.0
        with:
          publish-dir: .next
          production-deploy: ${{ github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main' }}
          deploy-message: "VantaCore Deploy from ${{ github.ref }} by ${{ github.actor }}"
          enable-pull-request-comment: true
          enable-commit-comment: true
          enable-commit-status: true
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

  VantaCore-Deploy-Cloudflare:
    name: VantaCore-Deploy-Cloudflare
    runs-on: ubuntu-latest
    needs: VantaCore-Preflight
    environment: ${{ github.event.inputs.environment || 'production' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}

      - name: VantaCore Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: vanta-core
          directory: .next
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '3'

  VantaCore-SmokeTests-Production:
    name: VantaCore-SmokeTests-Production
    runs-on: ubuntu-latest
    needs: [VantaCore-Deploy-Netlify, VantaCore-Deploy-Cloudflare]
    if: github.ref == 'refs/heads/main' && github.event.inputs.environment != 'preview'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Smoke Tests
        run: npm run test:smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.PRODUCTION_URL }}

  VantaCore-Deploy-Notify:
    name: VantaCore-Deploy-Notify
    runs-on: ubuntu-latest
    needs: [VantaCore-Deploy-Netlify, VantaCore-Deploy-Cloudflare, VantaCore-SmokeTests-Production]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: VantaCore Deploy Summary
        run: |
          echo "## VantaCore Deployment Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Target | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-Netlify | ${{ needs.VantaCore-Deploy-Netlify.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-Cloudflare | ${{ needs.VantaCore-Deploy-Cloudflare.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-SmokeTests | ${{ needs.VantaCore-SmokeTests-Production.result }} |" >> $GITHUB_STEP_SUMMARY
