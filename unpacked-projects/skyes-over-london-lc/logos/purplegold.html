<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skyes Over London LC - Visual</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #05000a; /* Deep violet-black */
            font-family: 'Times New Roman', serif;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            mix-blend-mode: screen;
        }

        .logo {
            font-size: 7vw;
            font-weight: 800;
            letter-spacing: 0.02em;
            color: #ffffff;
            text-transform: uppercase;
            position: relative;
            user-select: none;
            text-shadow: 
                0 0 20px rgba(138, 43, 226, 0.6), /* Purple Glow */
                0 0 40px rgba(255, 215, 0, 0.3); /* Gold outer Glow */
            animation: breathe 5s ease-in-out infinite;
        }

        .lc-highlight {
            color: transparent;
            -webkit-text-stroke: 1px #ffd700; /* Neon Gold Stroke */
            position: relative;
            display: inline-block;
            margin-left: 10px;
        }
        
        .lc-highlight::after {
            content: 'LC';
            position: absolute;
            left: 0;
            top: 0;
            color: #ffd700; /* Neon Gold Fill */
            opacity: 0.6;
            filter: blur(5px);
            animation: pulse-glow 4s infinite;
        }

        .subtitle {
            font-size: 1.2rem;
            color: #dcb3ff; /* Light Lavender */
            letter-spacing: 0.8em;
            margin-top: 1vw;
            opacity: 0.7;
            font-family: 'Segoe UI', sans-serif;
            text-transform: uppercase;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.01); opacity: 1; }
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 0.4; filter: blur(5px); }
            50% { opacity: 0.8; filter: blur(8px); }
        }

        #loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #05000a;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffd700; /* Gold Text */
            font-family: monospace;
            transition: opacity 1s ease-out;
        }
    </style>
</head>
<body>

    <div id="loader">CALIBRATING SKYLINE...</div>
    <div id="canvas-container"></div>

    <div id="ui-layer">
        <div class="logo">
            Skyes Over London <span class="lc-highlight">LC</span>
        </div>
        <div class="subtitle">Eminence in Motion</div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        const CONFIG = {
            particleCount: 2000,
            baseColor: 0x8a2be2, // Blue Violet/Purple
            accentColor: 0xffd700, // Neon Gold
            coreSize: 12
        };

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05000a, 0.003); // Match background color

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 60;

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // --- Geometric Core ---
        const coreGeo = new THREE.OctahedronGeometry(CONFIG.coreSize, 2);
        const coreMat = new THREE.MeshBasicMaterial({ 
            color: CONFIG.baseColor, 
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        const innerGeo = new THREE.OctahedronGeometry(CONFIG.coreSize * 0.5, 0);
        const innerMat = new THREE.MeshBasicMaterial({
            color: CONFIG.accentColor,
            transparent: true,
            opacity: 0.5,
            blending: THREE.AdditiveBlending
        });
        const innerCore = new THREE.Mesh(innerGeo, innerMat);
        scene.add(innerCore);

        // --- Star/Particle Field ---
        const particlesGeometry = new THREE.BufferGeometry();
        const posArray = new Float32Array(CONFIG.particleCount * 3);
        for(let i = 0; i < CONFIG.particleCount * 3; i++) {
            posArray[i] = (Math.random() - 0.5) * 250;
        }
        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
        const particleMaterial = new THREE.PointsMaterial({
            size: 0.5,
            color: 0xaa88ff, // Light purple stars
            transparent: true,
            opacity: 0.6
        });
        const particleMesh = new THREE.Points(particlesGeometry, particleMaterial);
        scene.add(particleMesh);

        // --- Interaction Logic ---
        let mouseX = 0, mouseY = 0;
        document.addEventListener('mousemove', (e) => {
            mouseX = (e.clientX - window.innerWidth / 2) * 0.02;
            mouseY = (e.clientY - window.innerHeight / 2) * 0.02;
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const time = clock.getElapsedTime();

            core.rotation.y += 0.003;
            innerCore.rotation.y -= 0.005;
            innerCore.scale.setScalar(1 + Math.sin(time) * 0.1);

            particleMesh.rotation.y = time * 0.02;
            
            camera.position.x += (mouseX - camera.position.x) * 0.05;
            camera.position.y += (-mouseY - camera.position.y) * 0.05;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }

        window.onload = () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => document.getElementById('loader').remove(), 1000);
            }, 1000);
            animate();
        };

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
    <link rel="stylesheet" href="../assets/menu.css">
    <script src="../assets/menu.js" defer></script>
</body>
</html>
