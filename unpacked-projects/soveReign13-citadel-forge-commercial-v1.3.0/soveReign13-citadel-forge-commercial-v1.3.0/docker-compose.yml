name: sovereign13-citadel-forge

services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - portal
      - control-plane
      - forgejo
    networks:
      - citadel

  portal:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./portal:/usr/share/nginx/html:ro
    networks:
      - citadel

  control-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${CONTROL_DB}
      POSTGRES_USER: ${CONTROL_DB_USER}
      POSTGRES_PASSWORD: ${CONTROL_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - control_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${CONTROL_DB_USER} -d ${CONTROL_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - citadel

  control-plane:
    build:
      context: ./control-plane
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8080
    depends_on:
      control-db:
        condition: service_healthy
      forgejo:
        condition: service_started
    networks:
      - citadel

  forgejo-db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${FORGEJO_DB}
      POSTGRES_USER: ${FORGEJO_DB_USER}
      POSTGRES_PASSWORD: ${FORGEJO_DB_PASSWORD}
      TZ: ${TZ}
    volumes:
      - forgejo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${FORGEJO_DB_USER} -d ${FORGEJO_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - citadel

  forgejo:
    image: ${FORGEJO_IMAGE}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      USER_UID: ${USER_UID}
      USER_GID: ${USER_GID}
      FORGEJO_CUSTOM: /data/forgejo/custom
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: forgejo-db:5432
      FORGEJO__database__NAME: ${FORGEJO_DB}
      FORGEJO__database__USER: ${FORGEJO_DB_USER}
      FORGEJO__database__PASSWD: ${FORGEJO_DB_PASSWORD}
      FORGEJO__server__DOMAIN: ${FORGE_DOMAIN}
      FORGEJO__server__ROOT_URL: https://${FORGE_DOMAIN}/
      FORGEJO__server__HTTP_PORT: 3000
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_DOMAIN: ${FORGE_DOMAIN}
      FORGEJO__server__SSH_PORT: ${FORGEJO_SSH_PORT}
      FORGEJO__server__SSH_LISTEN_PORT: ${FORGEJO_SSH_PORT}
      FORGEJO__service__DISABLE_REGISTRATION: ${DISABLE_REGISTRATION}
      FORGEJO__service__REQUIRE_SIGNIN_VIEW: ${REQUIRE_SIGNIN_VIEW}
      FORGEJO__security__SECRET_KEY: ${FORGEJO_SECRET_KEY}
      FORGEJO__security__INTERNAL_TOKEN: ${FORGEJO_INTERNAL_TOKEN}
      FORGEJO__oauth2__JWT_SECRET: ${FORGEJO_JWT_SECRET}
      FORGEJO__actions__ENABLED: "true"
      FORGEJO__packages__ENABLED: "true"
      FORGEJO__repository__DEFAULT_BRANCH: main
      FORGEJO__ui__DEFAULT_THEME: soveReign13
      FORGEJO__ui__THEMES: forgejo-auto,forgejo-light,forgejo-dark,gitea,arc-green,soveReign13
    ports:
      - "${FORGEJO_SSH_PORT}:${FORGEJO_SSH_PORT}"
    volumes:
      - forgejo_data:/data
      - ./forgejo/custom:/data/forgejo/custom
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      forgejo-db:
        condition: service_healthy
    networks:
      - citadel

  forgejo-runner:
    image: ${FORGEJO_RUNNER_IMAGE}
    restart: unless-stopped
    profiles:
      - runner
    env_file:
      - .env
    command: ["forgejo-runner", "daemon", "--config", "/config.yml"]
    volumes:
      - ./runner/config.yml:/config.yml:ro
      - forgejo_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - forgejo
    networks:
      - citadel

networks:
  citadel:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  control_db:
  forgejo_db:
  forgejo_data:
  forgejo_runner_data:
