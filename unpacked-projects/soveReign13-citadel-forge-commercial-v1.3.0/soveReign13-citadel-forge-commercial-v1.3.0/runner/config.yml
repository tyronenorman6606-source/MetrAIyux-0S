# SoveReign13 SceptR Forgejo Runner config.
# scripts/register-runner.sh writes the live server connection after Forgejo is running.

log:
  level: info

runner:
  capacity: 2
  envs: {}
  timeout: 3h
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "ubuntu-latest:docker://node:20-bookworm"
    - "ubuntu-22.04:docker://node:20-bookworm"
    - "node-20:docker://node:20-bookworm"
    - "docker:docker://docker:dind"

cache:
  enabled: true
  dir: /data/cache
  host: ""
  port: 0

container:
  network: "sovereign13-citadel-forge_citadel"
  privileged: false
  options: ""
  workdir_parent: /workspace
  valid_volumes: []
  docker_host: "unix:///var/run/docker.sock"
  force_pull: false
  force_rebuild: false

server:
  connections: {}
