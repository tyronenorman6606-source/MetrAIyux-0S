name: VantaCore-CI

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: vanta-core-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  VantaCore-Preflight:
    name: VantaCore Preflight Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Preflight Check
        run: npm run preflight
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_PHONE_NUMBER: ${{ secrets.TWILIO_PHONE_NUMBER }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_R2_BUCKET_NAME: ${{ secrets.CLOUDFLARE_R2_BUCKET_NAME }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          HEALTH_CHECK_SECRET: ${{ secrets.HEALTH_CHECK_SECRET }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}

  VantaCore-Lint:
    name: VantaCore Lint & Type Check
    runs-on: ubuntu-latest
    needs: VantaCore-Preflight
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore ESLint
        run: npm run lint

      - name: VantaCore Type Check
        run: npx tsc --noEmit

  VantaCore-Build:
    name: VantaCore Build
    runs-on: ubuntu-latest
    needs: VantaCore-Lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Build
        run: npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NODE_ENV: production

  VantaCore-SmokeTests:
    name: VantaCore Smoke Tests
    runs-on: ubuntu-latest
    needs: VantaCore-Build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: VantaCore Smoke Test
        run: npm run test:smoke
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  VantaCore-Summary:
    name: VantaCore CI Summary
    runs-on: ubuntu-latest
    needs: [VantaCore-Preflight, VantaCore-Lint, VantaCore-Build, VantaCore-SmokeTests]
    if: always()
    steps:
      - name: VantaCore CI Summary
        run: |
          echo "## VantaCore CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-Preflight | ${{ needs.VantaCore-Preflight.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-Lint | ${{ needs.VantaCore-Lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-Build | ${{ needs.VantaCore-Build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| VantaCore-SmokeTests | ${{ needs.VantaCore-SmokeTests.result }} |" >> $GITHUB_STEP_SUMMARY
