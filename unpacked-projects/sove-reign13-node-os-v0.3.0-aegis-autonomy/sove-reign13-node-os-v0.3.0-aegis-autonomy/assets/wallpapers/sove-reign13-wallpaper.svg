<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" role="img" aria-labelledby="title desc">
  <title id="title">SoveReign13 Node OS Wallpaper</title>
  <desc id="desc">Dark sovereign deployment wallpaper with glowing S13 mark.</desc>
  <defs>
    <radialGradient id="g1" cx="25%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#5eead4" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#111936" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#03030a" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#f7d774" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#03030a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="8" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1920" height="1080" fill="#03030a"/>
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <g opacity="0.14" stroke="#9cb5ff" stroke-width="1">
    <path d="M0 180H1920M0 360H1920M0 540H1920M0 720H1920M0 900H1920"/>
    <path d="M240 0V1080M480 0V1080M720 0V1080M960 0V1080M1200 0V1080M1440 0V1080M1680 0V1080"/>
  </g>
  <g filter="url(#glow)">
    <text x="50%" y="48%" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="164" font-weight="900" fill="#f7d774" letter-spacing="-12">S13</text>
    <text x="50%" y="58%" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="42" font-weight="700" fill="#f5f7ff" letter-spacing="8">SOVE REIGN NODE OS</text>
    <text x="50%" y="64%" text-anchor="middle" font-family="JetBrains Mono, monospace" font-size="24" fill="#5eead4" letter-spacing="4">CITADEL SEED · DEPLOYMENT COMMAND READY</text>
  </g>
</svg>
