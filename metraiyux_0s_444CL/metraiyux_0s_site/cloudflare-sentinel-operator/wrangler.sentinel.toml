name = "client-sentinel-operator"
main = "sentinel-worker.js"
compatibility_date = "2026-05-15"

[[kv_namespaces]]
binding = "SENTINEL_LEDGER"
id = "REPLACE_WITH_CLIENT_SENTINEL_KV_ID"

[[d1_databases]]
binding = "DB"
database_name = "client-command-deck-sentinel-db"
database_id = "REPLACE_WITH_CLIENT_SENTINEL_D1_ID"

[[queues.producers]]
binding = "SENTINEL_QUEUE"
queue = "client-sentinel-business-events"
