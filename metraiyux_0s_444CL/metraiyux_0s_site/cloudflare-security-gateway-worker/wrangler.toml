name = "client-security-gateway"
main = "src/worker.js"
compatibility_date = "2026-05-15"

[vars]
PUBLIC_ADMIN_URL = "https://client-domain.example"
RESEND_FROM_EMAIL = "Client Command Deck Approval Desk <approvals@client-domain.example>"
ADMIN_APPROVAL_EMAIL = "owner@example.com"

[[kv_namespaces]]
binding = "OMEGA_KV"
id = "REPLACE_WITH_CLIENT_SECURITY_KV_ID"

[[d1_databases]]
binding = "OMEGA_DB"
database_name = "client-command-deck-security-db"
database_id = "REPLACE_WITH_CLIENT_SECURITY_D1_ID"

[[queues.producers]]
binding = "OMEGA_QUEUE"
queue = "client-security-review-queue"
