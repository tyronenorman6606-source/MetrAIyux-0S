name = "client-crown-operator"
main = "src/worker.js"
compatibility_date = "2026-05-15"

[[kv_namespaces]]
binding = "CROWN_KV"
id = "REPLACE_WITH_CLIENT_CROWN_KV_ID"

[[d1_databases]]
binding = "CROWN_DB"
database_name = "client-command-deck-crown-db"
database_id = "REPLACE_WITH_CLIENT_CROWN_D1_ID"

[[queues.producers]]
binding = "CROWN_QUEUE"
queue = "client-crown-operator-events"
