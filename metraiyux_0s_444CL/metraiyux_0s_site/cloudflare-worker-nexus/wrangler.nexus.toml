
name = "client-nexus-operator"
main = "src/worker.js"
compatibility_date = "2026-05-15"

[[kv_namespaces]]
binding = "NEXUS_KV"
id = "REPLACE_WITH_CLIENT_NEXUS_KV_ID"

[[d1_databases]]
binding = "NEXUS_DB"
database_name = "client-command-deck-nexus-db"
database_id = "REPLACE_WITH_CLIENT_NEXUS_D1_ID"

[[queues.producers]]
binding = "NEXUS_QUEUE"
queue = "client-nexus-events"
