name = "client-command-deck-full-system"
main = "cloudflare/worker.js"
compatibility_date = "2026-05-15"

[assets]
directory = "./"
binding = "ASSETS"
run_worker_first = true

[[kv_namespaces]]
binding = "SITE_EVENTS_KV"
id = "REPLACE_WITH_CLIENT_SITE_EVENTS_KV_ID"

[[queues.producers]]
binding = "SITE_TASK_QUEUE"
queue = "client-command-deck-site-tasks"

[vars]
CLIENT_COMPANY_NAME = "Client Company"
CLIENT_PLATFORM_NAME = "Client Command Deck"
CLIENT_PUBLIC_URL = "https://client-domain.example"
ADMIN_WORKER_ORIGIN = "https://client-admin-automation.CLIENT_WORKERS_SUBDOMAIN.workers.dev"
SAAS_WORKER_ORIGIN = "https://client-saas-provisioning.CLIENT_WORKERS_SUBDOMAIN.workers.dev"
OMEGA_WORKER_ORIGIN = "https://client-security-gateway.CLIENT_WORKERS_SUBDOMAIN.workers.dev"
CROWN_WORKER_ORIGIN = "https://client-crown-operator.CLIENT_WORKERS_SUBDOMAIN.workers.dev"
NEXUS_WORKER_ORIGIN = "https://client-nexus-operator.CLIENT_WORKERS_SUBDOMAIN.workers.dev"
SENTINEL_WORKER_ORIGIN = "https://client-sentinel-operator.CLIENT_WORKERS_SUBDOMAIN.workers.dev"
SITE_OPERATOR_WORKER_ORIGIN = "https://client-site-operator.CLIENT_WORKERS_SUBDOMAIN.workers.dev"

[[services]]
binding = "SITE_OPERATOR_WORKER"
service = "client-site-operator"

[[services]]
binding = "ADMIN_WORKER"
service = "client-admin-automation"

[[services]]
binding = "SAAS_WORKER"
service = "client-saas-provisioning"

[[services]]
binding = "OMEGA_WORKER"
service = "client-security-gateway"

[[services]]
binding = "CROWN_WORKER"
service = "client-crown-operator"

[[services]]
binding = "NEXUS_WORKER"
service = "client-nexus-operator"

[[services]]
binding = "SENTINEL_WORKER"
service = "client-sentinel-operator"

# Optional later if you add Workers AI:
# [ai]
# binding = "AI"
